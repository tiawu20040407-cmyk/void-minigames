<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID // 录像排序 demo</title>
<style>
/* ===== 外观（之后由编辑器“外观”页修改） ===== */
:root{
  --bg:#0b0b0d;          /* 背景 */
  --fg:#e8e4d8;          /* 主色：文字、线框 */
  --dim:#6d6a62;         /* 次要文字 */
  --accent:#d9822b;      /* 强调色 */
  --danger:#d33a3a;      /* 错误、失败、空缺 */
  --ok:#9fd3a8;          /* 成功 */
  --font:"Courier New","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;max-width:820px;display:flex;white-space:nowrap;gap:8px;justify-content:space-between;align-items:center;
  padding:8px 12px;font-size:13px;letter-spacing:1px;border-bottom:1px solid var(--dim)}
#hud .label{color:var(--dim)}
#err span{display:inline-block;width:10px;height:10px;margin-left:3px;border:1px solid var(--danger)}
#err span.on{background:var(--danger)}
#main{position:relative;flex:1;width:100%;max-width:820px;overflow-y:auto;overflow-x:hidden;padding:10px 12px 16px;touch-action:pan-y}
#msg{min-height:20px;font-size:12px;color:var(--dim);margin-bottom:8px;line-height:1.6}
#msg.ok{color:var(--ok)} #msg.ng{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--dim);padding:4px;cursor:pointer;position:relative;background:#111114}
.card canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:auto}
.card .cap{display:flex;justify-content:space-between;font-size:11px;padding:3px 2px 0;letter-spacing:0}
.card .cap b{font-weight:normal;color:var(--dim)}
.card.gone{opacity:.25;pointer-events:none}
.card.gone::after{content:'已剔除';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;letter-spacing:4px;color:var(--danger)}
.card.hint{border:1px dashed var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.placed{opacity:.3;pointer-events:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* 时间轴 */
#tl{position:relative;height:34px;border:1px solid var(--dim);margin:6px 0 2px}
#tl .blk{position:absolute;top:3px;bottom:3px;background:var(--fg);opacity:.75}
#tl .hole{position:absolute;top:0;bottom:0;border:1px solid var(--danger);background:rgba(211,58,58,.25);
  animation:blink 1s steps(2) infinite;cursor:pointer}
@keyframes blink{50%{background:rgba(211,58,58,.05)}}
#tlAxis{position:relative;height:14px;font-size:10px;color:var(--dim)}
#tlAxis span{position:absolute;transform:translateX(-50%)}
#tlAxis span:first-child{transform:none}
/* 弹层 */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(11,11,13,.95);z-index:5;padding:12px}
.panel{width:100%;max-width:460px;border:1px solid var(--fg);padding:18px 18px 16px;font-size:13px;line-height:1.7;
  max-height:100%;overflow:auto;touch-action:pan-y;background:var(--bg)}
.panel.wide{max-width:680px;padding:10px}
.panel h1{font-size:15px;letter-spacing:3px;margin-bottom:10px;border-bottom:1px solid var(--dim);padding-bottom:6px}
.panel hr{border:0;border-top:1px dashed var(--dim);margin:10px 0}
.panel .muted,.muted{color:var(--dim);font-size:11px}
.notes div{margin:2px 0;padding-left:1em;text-indent:-1em}
#vc{display:block;margin:0 auto;border:1px solid var(--dim);background:#000}
#vInfo{font-size:12px;margin-top:6px;min-height:18px}
#vCap{font-size:13px;margin-top:6px;line-height:1.7;min-height:44px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
input{background:transparent;color:var(--fg);border:1px solid var(--dim);font:inherit;padding:2px 6px;width:64px}
input.name{width:90px}
input[type=checkbox]{accent-color:var(--fg);width:auto}
label{cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--fg)}
.seg button{margin:0;background:transparent;color:var(--fg);padding:5px 9px;letter-spacing:1px;font-weight:normal}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:bold}
button{background:var(--fg);color:var(--bg);border:0;font:inherit;font-weight:bold;letter-spacing:2px;
  padding:9px 16px;margin-top:10px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
button.danger{background:var(--danger);color:var(--bg)}
button:disabled{opacity:.35;cursor:default}
.mini{margin:0;padding:2px 8px;font-size:11px;letter-spacing:0;background:transparent;color:var(--fg);border:1px solid var(--dim);font-weight:normal}
.grade{font-size:28px;letter-spacing:6px;margin:4px 0 8px}
.grade.win{color:var(--ok)} .grade.lose{color:var(--danger)}
.resline{border:1px solid var(--dim);padding:6px 8px;margin-top:8px;font-size:12px;word-break:break-all;-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span class="label">STEP</span> <span id="step">—</span></div>
    <div><button type="button" class="mini" id="btnNotes">情报</button> <button type="button" class="mini hidden" id="btnHint">提示</button></div>
    <div><span class="label">错误</span><span id="err"></span></div>
  </div>
  <div id="main">
    <div id="msg"></div>
    <div id="sortBox" class="hidden">
      <div id="tl"></div>
      <div id="tlAxis"></div>
      <div class="row"><button type="button" id="btnRecover" class="danger hidden">恢复空缺</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="intro">
  <div class="panel">
    <h1>VOID // FOOTAGE</h1>
    <div>佐久间彰人公寓 · 门口监控</div>
    <div class="muted">2050-09-02 06:00–19:00</div>
    <hr>
    <div class="row">操作者 <input class="name" id="inName" value="HO2"></div>
    <div class="row">《计算机使用》 <input id="inSkill" type="number" min="1" max="99" value="80"></div>
    <div class="row">段数 <span class="seg" id="tierSeg">
      <button type="button" data-t="auto" class="on">按技能</button><button type="button" data-t="high">6 段</button><button type="button" data-t="low">8 段</button></span></div>
    <div class="muted" id="preview"></div>
    <div class="row">允许重来 <span class="seg" id="retrySeg">
      <button type="button" data-r="0">0</button><button type="button" data-r="1" class="on">1</button><button type="button" data-r="2">2</button><button type="button" data-r="3">3</button></span> 次</div>
    <div class="row">破绽类型 <span id="clueBox"></span></div>
    <hr>
    <div id="rules"></div>
    <div class="row"><button id="btnStart">调取录像</button></div>
    <div class="muted" style="margin-top:8px">demo：正式版中技能值由角色录入界面提供；段数、重来次数、破绽类型由 KP 设定，玩家看不到。</div>
  </div>
</div>

<!-- 情报 -->
<div class="overlay hidden" id="notes">
  <div class="panel">
    <h1>已知信息</h1>
    <div class="notes" id="notesList"></div>
    <div class="row"><button type="button" id="btnNotesClose">关闭</button></div>
  </div>
</div>

<!-- 查看片段 / 恢复播放 -->
<div class="overlay hidden" id="viewer">
  <div class="panel wide">
    <canvas id="vc"></canvas>
    <div id="vInfo"></div>
    <div id="vCap" class="hidden"></div>
    <div class="row" id="vBtns">
      <button type="button" class="ghost" id="btnPrev">‹</button>
      <button type="button" class="ghost" id="btnNext">›</button>
      <button type="button" class="danger" id="btnMark">标为伪造</button>
      <button type="button" class="ghost" id="btnClose">返回</button>
    </div>
    <div class="row hidden" id="pBtns"><button type="button" id="btnPlayNext">继续</button></div>
  </div>
</div>

<!-- 结果 -->
<div class="overlay hidden" id="result">
  <div class="panel">
    <h1>VOID // RESULT</h1>
    <div class="grade" id="rGrade"></div>
    <div id="rText"></div>
    <hr>
    <div id="rStats" class="muted"></div>
    <div class="resline" id="rLine"></div>
    <div class="row">
      <button id="btnRetry" class="hidden">重来</button>
      <button id="btnCopy">复制结果</button>
      <button class="ghost" id="btnAgain">重新开始（demo）</button>
    </div>
  </div>
</div>

<script>
{
/* ================================================================
   一、可编辑内容（之后由编辑器的“文本”“数值”“素材”页修改）
   ================================================================ */
const TEXT = {
  rules: '录像被拆成若干片段，其中混入了<b>其他日期</b>的录像。<br>' +
         '① 点开片段查看，找出伪造的片段并标记。标错 {maxErr} 次即失败。<br>' +
         '② 把剩下的片段按时间顺序排好。<br>' +
         '③ 恢复被删除的部分。<br>' +
         '点右上方“情报”可以随时查看已知信息。',
  notes: [
    '气象记录：9 月 2 日全天降雨。',
    '房东：“早报每天早上六点前送到门口。佐久间先生上午出门买东西时会顺手拿进屋。”',
    '房东：“他出门总带那把黑色长伞，回来就靠在门边晾着，第二天早上才收进去。”',
    '房东：“有只野猫傍晚会来走廊躲雨，白天从来不来。”',
  ],
  // 标对后显示的理由（按破绽类型）
  reveal: {
    weather:  '地面是干的，地上有影子——这是晴天拍的，不是 9/2。',
    paper:    '门口还放着早报。那天上午报纸就被拿进屋了——这是别的日子的录像。',
    umbrella: '门边没有伞。那天他上午出过门，伞应该一直靠在门边——这是别的日子的录像。',
    cat:      '野猫只在傍晚来，这个时间不该出现——这是别的日子的录像。',
  },
  // 提示（按破绽类型）
  hint: {
    weather:  '提示：这一段的天气不对劲。',
    paper:    '提示：注意这一段门前的地面。',
    umbrella: '提示：注意这一段门边少了什么。',
    cat:      '提示：注意这一段走廊上的东西。',
  },
  wrong: '数据完整，没有拼接痕迹。',
  foundAll: '已剔除全部伪造片段。按时间顺序点选剩下的片段。',
  sortWrong: '时间不连续，不是这一段。',
  sorted: '{from}–{to} 之间没有任何录像。点击空缺执行恢复。',
  recovering: ['正在扫描删除区块……', '找到残留数据。', '正在重建画面……'],
  rec: [
    '{t} 一个戴黑色兜帽的人走到门前，蹲下，摆弄门边的读卡器。几秒后，门开了。看不清脸。',
    '{t} 约十分钟后，那个人从屋里出来，压低兜帽，快步走出画面。',
  ],
  recPerfect: '画面放大后能看到：那个人走过的地上留下了几滴亮蓝色的液体。（VOID 的燃料）',
  gradePerfect: '极限成功', gradeWin: '成功', gradeLose: '失败',
  winText: '你们恢复了 9/2 下午被删除的录像。',
  perfectExtra: '（极限成功：恢复画面中发现了蓝色液体）',
  loseText: '录像确实被修改过，好像是把其他日期的录像拼接上去了。但没能找出被替换的部分。',
};

const CONFIG = {
  maxErrors: 3,         // 标错几次失败
  highSkillLine: 60,    // 技能值达到这个数用 6 段，否则 8 段
  tiers: {high:{fakes:1, hint:1}, low:{fakes:2, hint:0}},
  clueTypes: {weather:'天气（影子、水洼）', paper:'晨报', umbrella:'门口的伞', cat:'傍晚的野猫'},
  dayStart: 6*60, dayEnd: 19*60,
};

// 替换图片：放在 assets/ 文件夹，文件名见 docs/素材-录像排序.md。没有文件时用占位图。
const ASSET_FILES = ['bg_sunny','bg_rain','umbrella','newspaper','cat','hood_pick','hood_leave','blue_drops'];

/* ================================================================
   二、基础
   ================================================================ */
const $ = id => document.getElementById(id);
const rnd = Math.random, ri = (a,b) => a + Math.floor(rnd()*(b-a+1));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const hm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const IW = 640, IH = 480;   // 画面尺寸（替换图片也按这个尺寸）

/* ---------- 声音（合成，很短） ---------- */
let AC = null, NOISE = null, muted = false;
function sndInit(){
  if (AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(_){ return; }
  NOISE = AC.createBuffer(1, AC.sampleRate*0.4, AC.sampleRate);
  const d = NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = rnd()*2-1;
}
function tone(f, dur, type, vol, f2, delay){
  if (!AC || muted) return;
  const t = AC.currentTime + (delay||0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol){
  if (!AC || muted) return;
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = 1800;
  g.gain.setValueAtTime(vol||0.12, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime+dur);
}
const SFX = {
  click: () => tone(880, 0.04, 'square', 0.03),
  ok:    () => { tone(660, 0.08, 'square', 0.04); tone(990, 0.12, 'square', 0.04, 0, 0.08); },
  ng:    () => tone(160, 0.3, 'sawtooth', 0.06, 90),
  glitch:() => noise(0.35, 0.14),
  rec:   () => { tone(220, 0.6, 'triangle', 0.05, 880); noise(0.5, 0.05); },
  win:   () => [523,659,784].forEach((f,i) => tone(f, 0.18, 'square', 0.04, 0, i*0.1)),
  lose:  () => [330,262,196].forEach((f,i) => tone(f, 0.25, 'sawtooth', 0.04, 0, i*0.15)),
};

/* ================================================================
   三、占位图（160×120 像素画，放大 4 倍到 640×480）
   ================================================================ */
const PW = 160, PH = 120;
function px(g, c, x, y, w, h){ g.fillStyle = c; g.fillRect(x, y, w, h); }
function poly(g, c, pts){ g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i=2;i<pts.length;i+=2) g.lineTo(pts[i], pts[i+1]); g.closePath(); g.fill(); }
function ell(g, c, x, y, rx, ry){ g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); g.fill(); }

function phBackground(sunny){
  const c = mk(PW, PH), g = c.getContext('2d');
  // 天花板 + 灯
  px(g, '#2a2a2e', 0, 0, PW, 18); px(g, '#d8d6cf', 58, 6, 22, 3);
  // 墙
  px(g, sunny ? '#8f897c' : '#6e6a63', 0, 18, 112, 58);
  // 门
  px(g, '#3c3a36', 38, 27, 32, 49); px(g, '#57534c', 40, 29, 28, 47);
  px(g, '#dcd8cc', 49, 22, 10, 3);                       // 门牌
  px(g, '#1c1c1e', 72, 46, 5, 9); px(g, '#7fe08a', 74, 48, 1, 1);   // 读卡器
  // 柱子
  px(g, '#5a5650', 109, 18, 4, 58);
  // 走廊外：天空 + 远处楼
  px(g, sunny ? '#9cc8f0' : '#7c838d', 113, 18, 47, 44);
  px(g, sunny ? '#c5ced8' : '#5f6670', 118, 38, 14, 24); px(g, sunny ? '#b3bdc8' : '#565c66', 138, 30, 18, 32);
  // 栏杆（矮墙 + 扶手 + 竖杆）
  px(g, '#3e3e42', 113, 50, 47, 2);
  for (let x=116; x<160; x+=7) px(g, '#3e3e42', x, 52, 1, 10);
  px(g, sunny ? '#8f897c' : '#6e6a63', 113, 62, 47, 14);
  // 地面
  px(g, sunny ? '#bbb4a5' : '#66625b', 0, 76, PW, 44);
  g.globalAlpha = 0.25; for (let y=86; y<PH; y+=11) px(g, '#000', 0, y, PW, 1); g.globalAlpha = 1;
  if (sunny){
    // 影子：栏杆和矮墙投在地上
    g.globalAlpha = 0.32;
    poly(g, '#000', [113,76, 160,76, 160,90, 96,104]);
    for (let x=116; x<160; x+=7) poly(g, '#000', [x,90, x+1,90, x-14,118, x-15,118]);
    poly(g, '#000', [109,76, 113,76, 92,112, 88,112]);    // 柱子的影子
    g.globalAlpha = 0.18; poly(g, '#fff8e0', [113,90, 160,90, 160,120, 80,120]);  // 阳光照到的地面
    g.globalAlpha = 1;
  } else {
    // 水洼 + 湿地面反光
    for (const [x,y,rx,ry] of [[124,98,13,3],[92,110,9,2],[146,86,8,2],[30,104,7,2]]){
      ell(g, '#454b55', x, y, rx, ry); px(g, '#9aa3ad', x-rx+3, y-1, rx, 1);
    }
    g.globalAlpha = 0.10; for (let x=114; x<160; x+=5) px(g, '#fff', x, 77, 1, 9); g.globalAlpha = 1;
  }
  return c;
}
function phSprite(name){
  const c = mk(PW, PH), g = c.getContext('2d');
  if (name === 'umbrella'){
    g.globalAlpha = 0.6; ell(g, '#3e444c', 83, 78, 5, 1.5); g.globalAlpha = 1;
    px(g, '#bbb', 84, 49, 3, 1); px(g, '#bbb', 86, 50, 1, 2);       // 伞柄
    px(g, '#222', 84, 50, 1, 6);
    poly(g, '#1b1d22', [83,55, 86,55, 84,76, 83,76]);              // 伞面
    px(g, '#777', 84, 76, 1, 2);
  } else if (name === 'newspaper'){
    px(g, '#e9e5d9', 46, 80, 13, 6); px(g, '#c8c3b6', 46, 85, 13, 1);
    px(g, '#7d786e', 48, 81, 9, 1); px(g, '#7d786e', 48, 83, 6, 1);
  } else if (name === 'cat'){
    ell(g, '#2d2925', 127, 90, 6, 3);                               // 身体
    ell(g, '#2d2925', 120, 87, 3, 3);                               // 头
    poly(g, '#2d2925', [118,85, 119,82, 120,85]); poly(g, '#2d2925', [121,85, 122,82, 123,85]);
    px(g, '#e8c04a', 119, 87, 1, 1); px(g, '#e8c04a', 121, 87, 1, 1);
    px(g, '#2d2925', 132, 86, 1, 4); px(g, '#2d2925', 133, 84, 1, 3);   // 尾巴
    px(g, '#2d2925', 123, 92, 1, 2); px(g, '#2d2925', 130, 92, 1, 2);
  } else if (name === 'hood_pick'){
    ell(g, '#111215', 63, 60, 5, 6);                                // 兜帽
    poly(g, '#16171b', [57,64, 69,64, 71,78, 55,78]);               // 身体（蹲）
    px(g, '#16171b', 68, 52, 5, 2); px(g, '#16171b', 69, 54, 2, 10); // 伸向读卡器的手臂
  } else if (name === 'hood_leave'){
    ell(g, '#111215', 101, 60, 5, 6);
    poly(g, '#16171b', [95,64, 107,64, 108,84, 94,84]);
    poly(g, '#16171b', [96,84, 100,84, 98,96, 94,96]); poly(g, '#16171b', [102,84, 106,84, 110,95, 106,95]);
  } else if (name === 'blue_drops'){
    for (const [x,y] of [[72,84],[79,88],[86,92],[93,96],[99,100]]) px(g, '#29a6ff', x, y, 2, 1);
  }
  return c;
}
const PH_IMG = {};
const ASSETS = {};
function A(name){ return ASSETS[name] || PH_IMG[name]; }
function initPlaceholders(){
  PH_IMG.bg_sunny = phBackground(true); PH_IMG.bg_rain = phBackground(false);
  for (const n of ['umbrella','newspaper','cat','hood_pick','hood_leave','blue_drops']) PH_IMG[n] = phSprite(n);
}
function loadAssets(){
  return Promise.all(ASSET_FILES.map(n => new Promise(res => {
    const im = new Image(); im.onload = () => { ASSETS[n] = im; res(); }; im.onerror = () => res(); im.src = 'assets/' + n + '.png';
  })));
}

/* ================================================================
   四、画面合成：背景 + 贴图 + 光线 + 监控滤镜 + 时间戳
   ================================================================ */
const NOISE_C = (() => { const c = mk(PW, PH), g = c.getContext('2d'), d = g.createImageData(PW, PH);
  for (let i=0;i<d.data.length;i+=4){ const v = rnd()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=rnd()*90; }
  g.putImageData(d, 0, 0); return c; })();

function drawImg(g, im){
  g.imageSmoothingEnabled = !(im.width === PW && im.height === PH);   // 占位像素图不平滑
  g.drawImage(im, 0, 0, IW, IH); g.imageSmoothingEnabled = true;
}
function rainStreaks(g, seed, t){
  // 雨只下在走廊外（右侧天空和栏杆外）
  g.save(); g.strokeStyle = 'rgba(225,230,240,.45)'; g.lineWidth = 1.5; g.beginPath();
  for (let i=0;i<46;i++){
    const h = Math.sin(seed*13.1 + i*91.7)*43758.5, fx = h - Math.floor(h);
    const h2 = Math.sin(seed*7.3 + i*12.9)*12543.1, fy = h2 - Math.floor(h2);
    const x = 456 + fx*184, y = 72 + ((fy*230 + t*520) % 230);
    g.moveTo(x, y); g.lineTo(x-4, y+16);
  }
  g.stroke(); g.restore();
}
// seg: {weather, light, items[], time(分钟)}
function compose(seg, opt){
  opt = opt || {};
  const c = mk(IW, IH), g = c.getContext('2d');
  drawImg(g, A(seg.weather === 'sun' ? 'bg_sunny' : 'bg_rain'));
  for (const it of seg.items) if (it !== 'blue_drops') drawImg(g, A(it));
  if (seg.weather !== 'sun' && !opt.noRain) rainStreaks(g, seg.time, 0);
  // 光线
  if (seg.light === 'morning'){ g.fillStyle = 'rgba(170,190,255,.12)'; g.fillRect(0,0,IW,IH); }
  if (seg.light === 'dusk'){ g.fillStyle = 'rgba(20,10,40,.38)'; g.fillRect(0,0,IW,IH); g.fillStyle = 'rgba(255,120,40,.14)'; g.fillRect(0,0,IW,IH); }
  // 监控滤镜：降低饱和度 + 偏绿 + 扫描线 + 暗角
  g.globalCompositeOperation = 'saturation'; g.fillStyle = 'rgba(128,128,128,.7)'; g.fillRect(0,0,IW,IH);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(70,140,95,.10)'; g.fillRect(0,0,IW,IH);
  // 蓝色液体画在滤镜之后，保持颜色
  if (seg.items.includes('blue_drops')) drawImg(g, A('blue_drops'));
  g.fillStyle = 'rgba(0,0,0,.16)'; for (let y=0;y<IH;y+=3) g.fillRect(0,y,IW,1);
  const vg = g.createRadialGradient(IW/2, IH/2, IH*0.35, IW/2, IH/2, IH*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0,0,IW,IH);
  // 文字
  g.font = 'bold 20px "Courier New",monospace'; g.textBaseline = 'top'; g.shadowColor = '#000'; g.shadowBlur = 3;
  g.fillStyle = '#e8e4d8'; g.fillText('CAM-02', 14, 12);
  g.fillStyle = '#e04040'; g.fillText('● REC', 100, 12);
  g.fillStyle = '#e8e4d8'; g.fillText('2050-09-02 ' + hm(seg.time) + ':' + String(seg.sec||0).padStart(2,'0'), 14, IH-34);
  g.shadowBlur = 0;
  return c;
}

/* ================================================================
   五、一局的数据
   ================================================================ */
// 伪造片段的画面（按破绽类型）。下午真实状态：下雨、门边有伞、没有报纸、没有猫。
const FAKE_LOOK = {
  weather:  {weather:'sun',  items:[]},
  paper:    {weather:'rain', items:['umbrella','newspaper']},
  umbrella: {weather:'rain', items:[]},
  cat:      {weather:'rain', items:['umbrella','cat']},
};
function realLook(start){
  if (start < 10*60+25) return {weather:'rain', light:'morning', items:['newspaper']};
  if (start >= 17*60)   return {weather:'rain', light:'dusk',    items:['umbrella','cat']};
  return {weather:'rain', light:'day', items:['umbrella']};
}
function buildRound(tier, types){
  const T = CONFIG.tiers[tier];
  const hs = 14*60 + ri(50, 58), he = 15*60 + ri(28, 40);          // 被删除的区间
  const b1 = 10*60 + ri(20, 30), b2 = 13*60 + ri(0, 15), b3 = 17*60 + ri(10, 25);
  let cuts = tier === 'high' ? [[CONFIG.dayStart,b1],[b1,b2],[b2,hs],[he,b3],[b3,CONFIG.dayEnd]]
                             : [[CONFIG.dayStart,b1],[b1,11*60+ri(45,58)],[0,b2],[b2,hs],[he,b3],[b3,CONFIG.dayEnd]];
  if (tier === 'low') cuts[2][0] = cuts[1][1];
  const segs = cuts.map(([s,e]) => Object.assign({start:s, end:e, time:s, sec:ri(0,59), fake:false, clue:null}, realLook(s)));
  // 伪造片段：类型尽量不重复
  const pool = shuffle(types.slice()), picks = [];
  for (let i=0;i<T.fakes;i++) picks.push(pool.length ? pool[i % pool.length] : 'weather');
  const fr = T.fakes === 1 ? [[hs,he]] : (m => [[hs,m],[m,he]])(hs + Math.round((he-hs)/2) + ri(-4,4));
  fr.forEach(([s,e], i) => { const L = FAKE_LOOK[picks[i]];
    segs.push({start:s, end:e, time:s, sec:ri(0,59), fake:true, clue:picks[i], weather:L.weather, light:'day', items:L.items.slice()}); });
  shuffle(segs).forEach((s,i) => { s.no = i+1; s.gone = false; s.placed = false; s.img = compose(s); });
  return {tier, segs, hole:[hs,he], fakes:T.fakes, hints:T.hint};
}

/* ================================================================
   六、流程
   ================================================================ */
let R = null;          // 当前一局
let state = 'intro';   // intro / find / sort / gap / recover / result
let operator = 'HO2', skill = 80, retries = 1, attempt = 1, errors = 0, hintUsed = false, hintLeft = 0;
let tierChoice = 'auto', tStart = 0, lastResult = null;

function curTier(){ return tierChoice === 'auto' ? (skill >= CONFIG.highSkillLine ? 'high' : 'low') : tierChoice; }
function enabledTypes(){ const t = [...document.querySelectorAll('#clueBox input:checked')].map(x => x.value); return t.length ? t : ['weather']; }

function renderErr(){ $('err').innerHTML = Array.from({length:CONFIG.maxErrors}, (_,i) => `<span class="${i<errors?'on':''}"></span>`).join(''); }
function setMsg(t, cls){ $('msg').innerHTML = t; $('msg').className = cls || ''; }
function setStep(t){ $('step').textContent = t; }

function cardHTML(s){
  return `<div class="card" data-no="${s.no}"><canvas width="320" height="240"></canvas>` +
         `<div class="cap"><span>${hm(s.start)}–${hm(s.end)}</span><b>#${String(s.no).padStart(2,'0')}</b></div></div>`;
}
function renderGrid(list){
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('grid').querySelectorAll('.card').forEach(el => {
    const s = R.segs.find(x => x.no == el.dataset.no);
    el.querySelector('canvas').getContext('2d').drawImage(s.img, 0, 0, 320, 240);
    el.classList.toggle('gone', s.gone);
  });
}
function cardEl(no){ return $('grid').querySelector(`.card[data-no="${no}"]`); }

function startRound(){
  R = buildRound(curTier(), enabledTypes());
  errors = 0; hintUsed = false; hintLeft = R.hints; state = 'find'; tStart = performance.now();
  renderErr(); setStep('① 找出伪造片段');
  setMsg(`共 ${R.segs.length} 段，检测到拼接痕迹 <b>${R.fakes}</b> 处。点开片段查看。`);
  $('sortBox').classList.add('hidden'); $('btnRecover').classList.add('hidden');
  $('btnHint').classList.toggle('hidden', hintLeft <= 0); $('btnHint').disabled = false;
  renderGrid(R.segs);
}

/* ---------- 查看器 ---------- */
const vc = $('vc'), vg = vc.getContext('2d');
let view = null;    // {mode:'seg'|'play', seg, t0, glitch}
function fitViewer(){
  const w = Math.min(innerWidth - 46, IW, (innerHeight - 190) * 4/3), h = w*3/4;
  const dpr = Math.min(2, devicePixelRatio || 1);
  vc.style.width = w + 'px'; vc.style.height = h + 'px'; vc.width = Math.round(w*dpr); vc.height = Math.round(h*dpr);
}
function visibleSegs(){ return R.segs.filter(s => !s.gone); }
function openSeg(s){
  SFX.click(); view = {mode:'seg', seg:s, t0:performance.now(), glitch:0};
  $('vInfo').innerHTML = `片段 #${String(s.no).padStart(2,'0')}　${hm(s.start)}–${hm(s.end)}`;
  $('vCap').classList.add('hidden'); $('vBtns').classList.remove('hidden'); $('pBtns').classList.add('hidden');
  $('btnMark').disabled = false;
  $('viewer').classList.remove('hidden'); fitViewer();
}
function stepSeg(d){
  const L = visibleSegs(), i = L.indexOf(view.seg);
  openSeg(L[(i + d + L.length) % L.length]);
}
function closeViewer(){ $('viewer').classList.add('hidden'); view = null; }
$('btnPrev').onclick = () => stepSeg(-1);
$('btnNext').onclick = () => stepSeg(1);
$('btnClose').onclick = () => { SFX.click(); closeViewer(); };
$('btnMark').onclick = () => {
  if (state !== 'find' || !view || view.glitch) return;
  const s = view.seg;
  if (s.fake){
    SFX.glitch(); view.glitch = performance.now(); $('btnMark').disabled = true;
    setTimeout(() => {
      s.gone = true; closeViewer(); cardEl(s.no).classList.add('gone'); cardEl(s.no).classList.remove('hint');
      SFX.ok(); setMsg(TEXT.reveal[s.clue], 'ok');
      if (R.segs.every(x => !x.fake || x.gone)) setTimeout(toSort, 900);
    }, 650);
  } else {
    errors++; renderErr(); SFX.ng();
    $('vInfo').innerHTML = `<span style="color:var(--danger)">${TEXT.wrong}</span>`;
    vc.classList.remove('shake'); void vc.offsetWidth; vc.classList.add('shake');
    setMsg(`#${String(s.no).padStart(2,'0')}：${TEXT.wrong}（错误 ${errors}/${CONFIG.maxErrors}）`, 'ng');
    if (errors >= CONFIG.maxErrors) setTimeout(() => { closeViewer(); finish(false); }, 700);
  }
};
$('btnHint').onclick = () => {
  if (state !== 'find' || hintLeft <= 0) return;
  const f = R.segs.find(s => s.fake && !s.gone); if (!f) return;
  hintLeft--; hintUsed = true; SFX.click();
  $('btnHint').disabled = hintLeft <= 0;
  cardEl(f.no).classList.add('hint'); setMsg(TEXT.hint[f.clue] + '（虚线框）', '');
};
$('grid').addEventListener('click', e => {
  const el = e.target.closest('.card'); if (!el) return;
  const s = R.segs.find(x => x.no == el.dataset.no);
  if (state === 'find') openSeg(s);
  else if (state === 'sort') pickSort(s, el);
});

/* ---------- 排序 ---------- */
let sortNext = 0, sortList = [];
function tlPos(m){ return ((m - CONFIG.dayStart) / (CONFIG.dayEnd - CONFIG.dayStart) * 100) + '%'; }
function toSort(){
  state = 'sort'; setStep('② 按时间排序'); $('btnHint').classList.add('hidden');
  sortList = R.segs.filter(s => !s.fake).sort((a,b) => a.start - b.start); sortNext = 0;
  $('sortBox').classList.remove('hidden'); $('tl').innerHTML = '';
  $('tlAxis').innerHTML = [6,9,12,15,18].map(h => `<span style="left:${tlPos(h*60)}">${h}:00</span>`).join('');
  setMsg(TEXT.foundAll, 'ok');
  renderGrid(shuffle(R.segs.filter(s => !s.fake)));
}
function pickSort(s, el){
  if (s.placed) return;
  if (s === sortList[sortNext]){
    SFX.click(); s.placed = true; el.classList.add('placed'); sortNext++;
    const b = document.createElement('div'); b.className = 'blk';
    b.style.left = tlPos(s.start); b.style.width = `calc(${tlPos(s.end)} - ${tlPos(s.start)} - 1px)`;
    $('tl').appendChild(b);
    if (sortNext === sortList.length) showGap();
  } else {
    SFX.ng(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setMsg(TEXT.sortWrong, 'ng');
  }
}
function showGap(){
  state = 'gap'; setStep('③ 恢复');
  const [a,b] = R.hole, h = document.createElement('div'); h.className = 'hole';
  h.style.left = tlPos(a); h.style.width = `calc(${tlPos(b)} - ${tlPos(a)})`; h.onclick = recover;
  $('tl').appendChild(h);
  setMsg(TEXT.sorted.replace('{from}', hm(a)).replace('{to}', hm(b)), 'ng');
  $('btnRecover').textContent = `恢复 ${hm(a)}–${hm(b)}`; $('btnRecover').classList.remove('hidden');
  SFX.ng();
}
$('btnRecover').onclick = recover;

/* ---------- 恢复播放 ---------- */
let playFrames = [], playIdx = 0;
function recover(){
  if (state !== 'gap') return;
  state = 'recover'; SFX.rec(); $('btnRecover').classList.add('hidden');
  const perfect = errors === 0 && attempt === 1 && !hintUsed;
  const t1 = R.hole[0] + 4, t2 = t1 + 10;
  playFrames = [
    {seg:{weather:'rain', light:'day', items:['umbrella','hood_pick'], time:t1, sec:12}, cap:TEXT.rec[0].replace('{t}', hm(t1))},
    {seg:{weather:'rain', light:'day', items:['umbrella','hood_leave'].concat(perfect ? ['blue_drops'] : []), time:t2, sec:41},
     cap:TEXT.rec[1].replace('{t}', hm(t2)) + (perfect ? '<br><span style="color:#29a6ff">' + TEXT.recPerfect + '</span>' : '')},
  ];
  playFrames.forEach(f => f.img = compose(f.seg));
  playIdx = -1;
  view = {mode:'play', seg:null, t0:performance.now(), glitch:0, boot:performance.now()};
  $('vInfo').textContent = ''; $('vCap').classList.remove('hidden'); $('vCap').innerHTML = '';
  $('vBtns').classList.add('hidden'); $('pBtns').classList.add('hidden');
  $('viewer').classList.remove('hidden'); fitViewer();
  TEXT.recovering.forEach((l,i) => setTimeout(() => { $('vCap').innerHTML += esc(l) + '<br>'; SFX.click(); }, 300 + i*600));
  setTimeout(nextFrame, 300 + TEXT.recovering.length*600 + 300);
}
function nextFrame(){
  playIdx++;
  if (playIdx >= playFrames.length){ closeViewer(); finish(true); return; }
  const f = playFrames[playIdx];
  view.seg = f.seg; view.img = f.img; view.boot = 0; view.glitch = performance.now();
  SFX.glitch();
  $('vInfo').textContent = `恢复数据 ${playIdx+1}/${playFrames.length}`;
  $('vCap').innerHTML = f.cap; $('pBtns').classList.remove('hidden');
  $('btnPlayNext').textContent = playIdx === playFrames.length-1 ? '结束' : '继续';
}
$('btnPlayNext').onclick = () => { SFX.click(); nextFrame(); };

/* ---------- 查看器绘制（只在打开时运行） ---------- */
let noiseT = 0, noiseX = 0, noiseY = 0;
function drawViewer(now){
  if (!view) return;
  const W = vc.width, H = vc.height, k = W / IW;
  vg.setTransform(1,0,0,1,0,0);
  if (view.mode === 'play' && view.boot){
    // 恢复中：雪花屏
    vg.fillStyle = '#000'; vg.fillRect(0,0,W,H);
    vg.globalAlpha = 0.9; vg.drawImage(NOISE_C, rnd()*-40, rnd()*-30, W+60, H+40); vg.globalAlpha = 1;
    return;
  }
  const img = view.mode === 'seg' ? view.seg.img : view.img;
  vg.drawImage(img, 0, 0, W, H);
  const s = view.seg;
  if (s.weather !== 'sun'){ vg.setTransform(k,0,0,k,0,0); rainStreaks(vg, s.time + 7, (now - view.t0)/1000); vg.setTransform(1,0,0,1,0,0); }
  if (now - noiseT > 80){ noiseT = now; noiseX = rnd()*-40; noiseY = rnd()*-30; }
  vg.globalAlpha = 0.22; vg.drawImage(NOISE_C, noiseX, noiseY, W+40, H+30); vg.globalAlpha = 1;
  // 拼接痕迹 / 切换时的撕裂
  const ga = view.glitch ? (now - view.glitch) : 9999;
  if (ga < 650){
    for (let i=0;i<9;i++){
      const y = rnd()*H, h = 4 + rnd()*H*0.08, dx = (rnd()-0.5)*W*0.25;
      vg.drawImage(vc, 0, y, W, h, dx, y, W, h);
    }
    vg.fillStyle = `rgba(211,58,58,${0.35*(1-ga/650)})`; vg.fillRect(0,0,W,H);
  } else if (view.glitch && view.mode === 'play'){ view.glitch = 0; }
}

/* ---------- 结果 ---------- */
function finish(win){
  if (state === 'result') return;
  state = 'result';
  const used = (performance.now() - tStart)/1000;
  const perfect = win && errors === 0 && attempt === 1 && !hintUsed;
  const grade = perfect ? 'perfect' : win ? 'win' : 'lose';
  const canRetry = !win && attempt <= retries;
  const gName = {perfect:TEXT.gradePerfect, win:TEXT.gradeWin, lose:TEXT.gradeLose}[grade];
  lastResult = {game:'footage-sort', operator, skill, segments:R.segs.length, fakes:R.fakes, grade,
                errors, attempt, hintUsed, time:+used.toFixed(1), final:!canRetry};
  $('rGrade').textContent = gName; $('rGrade').className = 'grade ' + (win ? 'win' : 'lose');
  $('rText').innerHTML = win ? TEXT.winText + (perfect ? '<br><span class="muted">' + TEXT.perfectExtra + '</span>' : '') : TEXT.loseText;
  $('rStats').textContent = `${R.segs.length} 段（伪造 ${R.fakes}）· 错误 ${errors}/${CONFIG.maxErrors} · 第 ${attempt} 次尝试` +
    (hintUsed ? ' · 用了提示' : '') + ` · 用时 ${used.toFixed(1)} 秒`;
  $('rLine').textContent = `【录像排序·第二现场】${operator} 计算机使用${skill} → ${gName}（${R.segs.length}段，错误${errors}次，第${attempt}次尝试${hintUsed?'，用了提示':''}）`;
  $('btnRetry').classList.toggle('hidden', !canRetry);
  $('btnRetry').textContent = `重来（剩余 ${retries - attempt + 1} 次）`;
  $('btnCopy').textContent = canRetry ? '放弃，复制失败结果' : '复制结果';
  win ? SFX.win() : SFX.lose();
  setTimeout(() => $('result').classList.remove('hidden'), 600);
}
$('btnRetry').onclick = () => { SFX.click(); attempt++; $('result').classList.add('hidden'); startRound(); };
$('btnAgain').onclick = () => { SFX.click(); $('result').classList.add('hidden'); $('intro').classList.remove('hidden'); state = 'intro'; refreshIntro(); };
$('btnCopy').onclick = () => {
  const txt = $('rLine').textContent, b = $('btnCopy'), old = b.textContent;
  const done = () => { b.textContent = '已复制'; setTimeout(() => b.textContent = old, 1500); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
};

/* ---------- 开始界面 ---------- */
$('clueBox').innerHTML = Object.entries(CONFIG.clueTypes).map(([k,n]) => `<label><input type="checkbox" value="${k}" checked> ${n}</label>`).join(' ');
function segPick(seg, btn){ seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===btn)); }
$('tierSeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('tierSeg'), b); tierChoice = b.dataset.t; refreshIntro(); } };
$('retrySeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('retrySeg'), b); retries = +b.dataset.r; } };
function refreshIntro(){
  skill = Math.max(1, Math.min(99, +$('inSkill').value || 1));
  const t = curTier(), T = CONFIG.tiers[t];
  $('preview').textContent = t === 'high' ? `6 段，其中伪造 ${T.fakes} 段，可用提示 ${T.hint} 次` : `8 段，其中伪造 ${T.fakes} 段，无提示`;
  $('rules').innerHTML = TEXT.rules.replace('{maxErr}', CONFIG.maxErrors) +
    '<br><span class="muted">零失误、未用提示、第一次就通关为极限成功；重来后通关为成功。</span>';
}
$('inSkill').addEventListener('input', refreshIntro);
$('btnStart').onclick = () => {
  sndInit(); SFX.click();
  operator = $('inName').value.trim() || 'HO2'; refreshIntro(); $('inSkill').value = skill;
  attempt = 1; $('intro').classList.add('hidden'); startRound();
};
$('notesList').innerHTML = TEXT.notes.map(n => `<div>· ${esc(n)}</div>`).join('');
$('btnNotes').onclick = () => { SFX.click(); $('notes').classList.remove('hidden'); };
$('btnNotesClose').onclick = () => { SFX.click(); $('notes').classList.add('hidden'); };

/* ---------- 主循环 ---------- */
function loop(now){ drawViewer(now); requestAnimationFrame(loop); }
addEventListener('resize', () => { if (view) fitViewer(); });
initPlaceholders(); renderErr(); refreshIntro();
$('btnStart').disabled = true; $('btnStart').textContent = '加载中…';
loadAssets().then(() => { $('btnStart').disabled = false; $('btnStart').textContent = '调取录像'; });
requestAnimationFrame(loop);

// 测试接口
window.__void = {get R(){return R;}, get state(){return state;}, get lastResult(){return lastResult;}, compose, A};
}
</script>
