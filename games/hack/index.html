<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID // 骇入 demo</title>
<style>
/* ===== 外观（之后由编辑器“外观”页修改） ===== */
:root{
  --bg:#0b0b0d;          /* 背景 */
  --fg:#e8e4d8;          /* 主色：文字、玩家、线框 */
  --dim:#6d6a62;         /* 次要文字、网格 */
  --enemy:#d9822b;       /* 可击落子弹、敌人强调色 */
  --hard:#3a1418;        /* 不可击落子弹（填充） */
  --hard-edge:#c0475a;   /* 不可击落子弹（描边） */
  --danger:#d33a3a;      /* 受伤、失败、激光 */
  --ok:#9fd3a8;          /* 成功 */
  --font:"Courier New","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;max-width:640px;display:flex;white-space:nowrap;gap:8px;justify-content:space-between;align-items:center;
  padding:8px 12px;font-size:13px;letter-spacing:1px;border-bottom:1px solid var(--dim)}
#hud .label{color:var(--dim)}
#hp span{display:inline-block;width:10px;height:10px;margin-left:3px;border:1px solid var(--fg)}
#hp span.on{background:var(--fg)}
#timer.low{color:var(--danger)}
#qnote{color:var(--dim);font-size:10px;margin-left:6px}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
canvas{display:block;border:1px solid var(--dim)}
#scan{position:absolute;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#foot{font-size:11px;color:var(--dim);padding:6px;text-align:center}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(11,11,13,.94);z-index:5;padding:16px}
.panel{width:100%;max-width:460px;border:1px solid var(--fg);padding:18px 18px 16px;font-size:13px;line-height:1.7;
  max-height:100%;overflow:auto;touch-action:pan-y}
.panel h1{font-size:15px;letter-spacing:3px;margin-bottom:10px;border-bottom:1px solid var(--dim);padding-bottom:6px}
.panel .q{color:var(--enemy)}
.panel hr{border:0;border-top:1px dashed var(--dim);margin:10px 0}
.panel .muted{color:var(--dim);font-size:11px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
input{background:transparent;color:var(--fg);border:1px solid var(--dim);font:inherit;padding:2px 6px;width:64px}
input.name{width:90px}
input[type=radio],input[type=range],input[type=checkbox]{accent-color:var(--fg);width:auto}
label{cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--fg)}
.seg button{margin:0;background:transparent;color:var(--fg);padding:6px 10px;letter-spacing:1px;font-weight:normal}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:bold}
button{background:var(--fg);color:var(--bg);border:0;font:inherit;font-weight:bold;letter-spacing:2px;
  padding:9px 16px;margin-top:10px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.grade{font-size:28px;letter-spacing:6px;margin:4px 0 8px}
.grade.win{color:var(--ok)} .grade.lose{color:var(--danger)}
.resline{border:1px solid var(--dim);padding:6px 8px;margin-top:8px;font-size:12px;word-break:break-all}
#tools{position:absolute;z-index:4;display:flex;gap:6px}
.mini{margin:0;background:rgba(11,11,13,.7)!important;padding:2px 6px;font-size:11px;letter-spacing:0;background:transparent;color:var(--fg);border:1px solid var(--dim);font-weight:normal}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span class="label">TARGET</span> <span id="tname">警察仿生人</span></div>
    <div id="timer">75.0</div>
    <div><span class="label">HP</span><span id="hp"></span><span id="qnote"></span></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="scan"></div>
    <div id="tools"><button type="button" id="btnEndPr" class="mini hidden">结束练习</button><button type="button" id="btnMute" class="mini">声音 开</button></div>

    <!-- 开始界面 -->
    <div class="overlay" id="intro">
      <div class="panel">
        <h1>VOID // INTRUSION</h1>
        <div>目标：<b>警察仿生人</b>（拘留所）</div>
        <div class="q" id="quote"></div>
        <hr>
        <div class="row">操作者 <input class="name" id="inName" value="HO4"></div>
        <div class="row">《艺术（黑客）》 <input id="inSkill" type="number" min="1" max="99" value="80"></div>
        <div class="muted" id="preview"></div>
        <div class="row">难度 <span class="seg" id="diffSeg"></span></div>
        <div class="row">关卡 <span class="seg" id="stageSeg"></span></div>
        <hr>
        <div class="row">操控
          <label><input type="radio" name="ctrl" value="follow" checked> 跟手</label>
          <label><input type="radio" name="ctrl" value="stick"> 摇杆</label>
        </div>
        <div class="row">灵敏度 <input id="inSens" type="range" min="0.6" max="2.5" step="0.1" value="1.2" style="width:140px;border:0"> <span id="sensV">1.2</span></div>
        <div class="row">音效 <input id="inSfx" type="range" min="0" max="1" step="0.05" value="0.8" style="width:90px;border:0">
          音乐 <input id="inBgm" type="range" min="0" max="1" step="0.05" value="0.5" style="width:90px;border:0"></div>
        <div class="row"><label><input type="checkbox" id="inLow"> 简化特效</label><span class="muted">（卡顿时会自动开启）</span></div>
        <hr>
        <div id="rules"></div>
        <div class="row"><button id="btnStart">开始骇入</button><button class="ghost" id="btnPractice">练习模式</button></div>
        <div class="muted" style="margin-top:8px">demo：正式版中技能值由角色录入界面提供；难度和关卡由 KP 设定，玩家看不到。</div>
      </div>
    </div>

    <!-- 结果界面 -->
    <div class="overlay hidden" id="result">
      <div class="panel">
        <h1>VOID // RESULT</h1>
        <div class="grade" id="rGrade"></div>
        <div id="rText"></div>
        <hr>
        <div id="rStats" class="muted"></div>
        <div class="resline" id="rLine"></div>
        <div class="row">
          <button id="btnCopy">复制结果</button>
          <button class="ghost" id="btnRetry">重新开始（demo）</button>
        </div>
      </div>
    </div>
  </div>
  <div id="foot">电脑：WASD / 方向键移动　手机：按住屏幕任意位置拖动　自动瞄准、自动射击</div>
</div>

<script>
{
/* ================================================================
   一、可编辑内容（之后由编辑器的“文本”“数值”页修改）
   ================================================================ */
const TEXT = {
  quote: '“无入室许可，将作为入侵的违反行为进行报告。”',
  common: '<span style="color:var(--enemy)">● 橙色子弹</span>可以击落，' +
          '<span style="color:var(--hard-edge)">● 暗色子弹</span>和<span style="color:var(--danger)">激光</span>不能。<br>' +
          '限时 {time} 秒。终端耐久归零或超时即失败。',
  gradePerfect: '极限成功', gradeWin: '成功', gradeLose: '失败',
  winText: '碰到了{name}的仿生人突然静止不动了，你们成功前进。',
  perfectExtra: '（极限成功：KP 可追加一条额外信息）',
  loseText: '入侵被系统察觉。仿生人举起了枪——与仿生人进行战斗。',
  loseHP: '骇入进度 {pct}%：警察仿生人 HP {from} → {to}',
  tips: ['练习模式：不计入判定', '只需要移动，射击是自动的', '橙色子弹可以击落', '暗色子弹打不掉，只能躲', '红色虚线 = 激光即将发射', '中心的红点才是判定点'],
};

const CONFIG = {
  difficulty: 1.3,
  diffTiers: [['一档',1.3],['二档',1.4],['三档',1.6]],
  enemyHP: 15,        // 原文警察仿生人 HP
  failCutMax: 7,      // 失败时按进度最多削减的 HP
};

// 关卡：时间、极限成功所需剩余时间、说明。具体敌人配置在“四、关卡”里。
const STAGES = {
  firewall: {name:'防火墙', time:75, perfectLeft:20,
    desc:'击破 4 个防火墙后，核心的护盾解除。击破核心即骇入成功。'},
  swarm:    {name:'数据流', time:70, perfectLeft:18,
    desc:'清除三波入侵检测程序。扫描器发射激光前会出现红色虚线预警。'},
  boss:     {name:'守卫程序', time:90, perfectLeft:20,
    desc:'击破守卫程序。它的攻击分三个阶段，每次转换阶段会短暂无敌。'},
};
const STAGE_ORDER = ['firewall','swarm','boss'];

function paramsFromSkill(s, diff){
  s = Math.max(1, Math.min(99, s|0));
  diff = diff || CONFIG.difficulty;
  return {
    playerHP:     Math.max(1, Math.min(4, 1 + Math.floor(s/25))),
    fireInterval: 0.17 - s*0.0006,                       // 越小射得越快
    bulletSpeed:  (1.25 - s*0.005) * (0.6 + 0.4*diff),   // 敌弹速度倍率
    density:      (1.30 - s*0.006) * diff,               // 敌弹密度倍率
  };
}

/* ================================================================
   二、基础：画布、颜色、画质
   ================================================================ */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', {alpha:false});
const W = 600, H = 600, CX = 300, CY = 300, TAU = Math.PI*2;
const sin = Math.sin, cos = Math.cos, atan2 = Math.atan2, rnd = Math.random;
let scale = 1, dpr = 1, kk = 1;
const Q = {low:false, forced:false};   // 画质：low = 简化特效
let COL, FONT, PCOL, VIGNETTE = null;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function readTheme(){
  COL = {bg:cssv('--bg'), fg:cssv('--fg'), dim:cssv('--dim'), enemy:cssv('--enemy'), hard:cssv('--hard'),
         hardEdge:cssv('--hard-edge'), danger:cssv('--danger'), ok:cssv('--ok')};
  FONT = cssv('--font');
  PCOL = [COL.fg, COL.enemy, COL.danger, COL.hardEdge, COL.dim];   // 粒子颜色表（按索引批量绘制）
}
function hexA(hex, a){ const h = hex.replace('#',''); const n = parseInt(h.length===3?h.replace(/./g,'$&$&'):h, 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function resize(){
  const hud = $('hud').offsetHeight, foot = $('foot').offsetHeight;
  const size = Math.floor(Math.min(innerWidth - 16, innerHeight - hud - foot - 16, 640));
  dpr = Math.min(Q.low ? 1 : 2, devicePixelRatio || 1);     // 限制像素比：3 倍屏也只画 2 倍
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = Math.floor(size * dpr);
  scale = size / W; kk = scale * dpr;
  for (const k in SPR) delete SPR[k];                         // 精灵按新分辨率重建
  VIGNETTE = null;
  const r = cv.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
  Object.assign($('scan').style, {left:(r.left-s.left)+'px', top:(r.top-s.top)+'px', width:size+'px', height:size+'px'});
  Object.assign($('tools').style, {right:(s.right-r.right+6)+'px', top:(r.top-s.top+(stageId==='boss'&&G?34:6))+'px'});
}
function setLow(on, auto){
  if (Q.low === on) return;
  Q.low = on; resize();
  $('qnote').textContent = on ? (auto ? '已自动简化特效' : '简化特效') : '';
}

/* ---- 预渲染精灵：子弹、光晕一次画好，之后每颗只需一次 drawImage ---- */
const SPR = {};
function sprite(kind, r){
  const key = kind + r; if (SPR[key]) return SPR[key];
  const glowOn = !Q.low, pad = glowOn ? r*2.6 : r+2;
  const c = document.createElement('canvas'), px = Math.ceil(pad*2*kk);
  c.width = c.height = px;
  const g = c.getContext('2d'); g.scale(px/(pad*2), px/(pad*2)); g.translate(pad, pad);
  const col = {o:COL.enemy, h:COL.hardEdge, p:COL.fg, g:COL.fg, gr:COL.danger, ge:COL.enemy}[kind] || COL.fg;   // g* = 只有光晕
  if (glowOn){
    const gr = g.createRadialGradient(0,0,r*0.5,0,0,pad);
    gr.addColorStop(0, hexA(col,0.55)); gr.addColorStop(0.45, hexA(col,0.18)); gr.addColorStop(1, hexA(col,0));
    g.fillStyle = gr; g.fillRect(-pad,-pad,pad*2,pad*2);
  }
  if (kind==='o'){ g.fillStyle = COL.enemy; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
    g.fillStyle = '#fff3e0'; g.beginPath(); g.arc(0,0,r*0.45,0,TAU); g.fill(); }
  else if (kind==='h'){ g.fillStyle = COL.hard; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
    g.strokeStyle = COL.hardEdge; g.lineWidth = 2; g.stroke(); }
  return SPR[key] = {c, h:pad};
}
function blit(kind, r, x, y, s){ const sp = sprite(kind, r), h = sp.h*(s||1); ctx.drawImage(sp.c, x-h, y-h, h*2, h*2); }

/* ================================================================
   三、对象池：子弹、玩家子弹、粒子都循环使用，不产生垃圾回收卡顿
   ================================================================ */
function Pool(max, make){ this.a = []; for (let i=0;i<max;i++) this.a.push(make()); this.n = 0; this.max = max; }
Pool.prototype.take = function(){ return this.n < this.max ? this.a[this.n++] : null; };
Pool.prototype.kill = function(i){ const a = this.a, j = --this.n, t = a[i]; a[i] = a[j]; a[j] = t; };
const BUL  = new Pool(900, () => ({x:0,y:0,vx:0,vy:0,r:6,hard:false}));
const SHOT = new Pool(160, () => ({x:0,y:0,vx:0,vy:0}));
const PART = new Pool(520, () => ({x:0,y:0,vx:0,vy:0,life:0,c:0}));

/* ================================================================
   声音：每种声音一个插槽。填了文件名就播放文件（放在 audio/ 目录），
   没填或加载失败就用代码合成的占位音。之后由编辑器“素材”页修改。
   ================================================================ */
const SOUND_FILES = {   // 由 tools/audio/sfx.py 生成（shot 为魔王魂素材）
  shot:'shot.wav', hit:'hit.wav', pop:'pop.wav', small:'small.wav', big:'big.mp3', shield:'shield.mp3', hurt:'hurt.wav',
  warn:'warn.wav', laser:'laser.mp3', link:'link.mp3', win:'win.mp3', lose:'lose.mp3', click:'click.wav', wave:'wave.wav',
};
// BGM：前奏播一次，之后在 loopStart～loopEnd 之间循环（秒）。循环点由 tools/audio/loop.py 找出。
// stage 用于“防火墙”“数据流”，boss 用于“守卫程序”。
const BGM = {
  stage: {file:'bgm-stage.mp3', loopStart:22.5545, loopEnd:84.8922},    // HACK_NORMAL
  boss:  {file:'bgm-boss.mp3',  loopStart:51.7616, loopEnd:150.0473},   // HACK_BOSS
};
const SOUND_VOL = { shot:0.35, hit:0.45, pop:0.4, small:0.6, big:0.85, shield:1, hurt:0.9,
                    warn:0.55, laser:0.5, link:0.7, wave:0.6, win:1, lose:0.9, click:0.5 };   // 各插槽的单独音量

const SND = {ctx:null, sfx:null, bgmGain:null, buf:{}, el:{}, eli:{}, last:{}, vol:{sfx:0.8, bgm:0.5}, mute:false,
             bgmBuf:{}, bgmFail:{}, bgmSrc:null, bgmEl:null, bgmName:''};
const GAP = {shot:0.09, hit:0.05, pop:0.04, small:0.06, warn:0.15};   // 同一声音的最短间隔，防止叠成噪音
function sndInit(){             // 必须在点击里调用（手机浏览器的要求）
  if (SND.ctx){ if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = SND.ctx = new AC();
  SND.sfx = c.createGain(); SND.sfx.connect(c.destination);
  SND.bgmGain = c.createGain(); SND.bgmGain.connect(c.destination);
  sndApplyVol();
  const load = f => fetch('audio/' + f).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(a => new Promise((ok, no) => c.decodeAudioData(a, ok, no)));
  for (const k in SOUND_FILES) if (SOUND_FILES[k])
    load(SOUND_FILES[k]).then(b => SND.buf[k] = b)
      .catch(() => {   // 本地双击打开（file://）时读不到文件，改用 <audio> 元素播放
        SND.el[k] = Array.from({length:4}, () => { const a = new Audio('audio/' + SOUND_FILES[k]); a.preload = 'auto'; return a; });
      });
  for (const k in BGM) if (BGM[k].file)
    load(BGM[k].file).then(b => { SND.bgmBuf[k] = b; if (SND.bgmName === k && !SND.bgmSrc && !SND.bgmEl) bgmStart(k); })
      .catch(() => { SND.bgmFail[k] = true; if (SND.bgmName === k && !SND.bgmSrc && !SND.bgmEl) bgmStart(k); });
}
function sndApplyVol(){
  if (SND.sfx) SND.sfx.gain.value = SND.mute ? 0 : SND.vol.sfx;
  if (SND.bgmGain) SND.bgmGain.gain.value = SND.mute ? 0 : SND.vol.bgm;
  if (SND.bgmEl) SND.bgmEl.volume = SND.mute ? 0 : SND.vol.bgm;
}
function bgmStop(){
  const c = SND.ctx;
  if (SND.bgmSrc && c){ const {s, g} = SND.bgmSrc, t = c.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.6); s.stop(t + 0.65); }
  SND.bgmSrc = null;
  if (SND.bgmEl){ SND.bgmEl.pause(); SND.bgmEl = null; }
}
function bgmStart(name){
  const c = SND.ctx, buf = SND.bgmBuf[name];
  if (buf && c){
    // mp3 解码时开头可能多出一段静音（各浏览器不同），找到第一个非零采样作为循环起点
    const d = buf.getChannelData(0); let z = 0; const lim = Math.min(d.length, buf.sampleRate*0.2);
    while (z < lim && d[z] === 0) z++;
    const s = c.createBufferSource(), g = c.createGain();
    const z0 = z / buf.sampleRate, cfg = BGM[name];
    s.buffer = buf; s.loop = true;
    s.loopStart = z0 + cfg.loopStart; s.loopEnd = Math.min(buf.duration, z0 + cfg.loopEnd);
    g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(1, c.currentTime + 0.3);
    s.connect(g); g.connect(SND.bgmGain); s.start(0, z0);          // 从头播放前奏，到 loopEnd 后跳回 loopStart
    SND.bgmSrc = {s, g};
  } else if (SND.bgmFail[name]){   // 本地打开时的兜底
    const cfg = BGM[name], a = new Audio('audio/' + cfg.file);
    a.addEventListener('timeupdate', () => { if (a.currentTime >= cfg.loopEnd) a.currentTime = cfg.loopStart; });
    a.addEventListener('ended', () => { a.currentTime = cfg.loopStart; a.play().catch(() => {}); });
    SND.bgmEl = a; sndApplyVol(); a.play().catch(() => {});
  }
  // 还没加载完：加载完成时会自动开始
}
function bgm(name){
  name = name && BGM[name] && BGM[name].file ? name : '';
  if (SND.bgmName === name) return;
  bgmStop(); SND.bgmName = name;
  if (name) bgmStart(name);
}
function sfx(name){
  const c = SND.ctx; if (!c || SND.mute) return;
  const t = c.currentTime, g = GAP[name] || 0;
  if (g && SND.last[name] && t - SND.last[name] < g) return; SND.last[name] = t;
  if (SND.buf[name]){ const s = c.createBufferSource(), v = c.createGain(); s.buffer = SND.buf[name];
    v.gain.value = SOUND_VOL[name] ?? 1; s.connect(v); v.connect(SND.sfx); s.start(); return; }
  if (SND.el[name]){ const pool = SND.el[name], i = SND.eli[name] = ((SND.eli[name]||0)+1) % pool.length, a = pool[i];
    a.volume = Math.min(1, (SOUND_VOL[name] ?? 1) * SND.vol.sfx); a.currentTime = 0; a.play().catch(() => {}); return; }
  SYNTH[name] && SYNTH[name](c, t);
}
// ---- 合成占位音 ----
function osc(c, t, type, f0, f1, dur, vol){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(SND.sfx); o.start(t); o.stop(t+dur+0.02);
}
let NOISE = null;
function noise(c, t, dur, vol, f0, f1){
  if (!NOISE){ NOISE = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = rnd()*2-1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = NOISE; f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(SND.sfx); s.start(t); s.stop(t+dur+0.02);
}
const SYNTH = {

  pop:   (c,t) => noise(c, t, 0.05, 0.08, 6000, 1500),
  small: (c,t) => { noise(c, t, 0.25, 0.25, 3000, 200); osc(c, t, 'sine', 160, 50, 0.2, 0.2); },
  big:   (c,t) => { noise(c, t, 0.7, 0.45, 5000, 80); osc(c, t, 'sine', 110, 30, 0.6, 0.45); },
  shield:(c,t) => { noise(c, t, 1.1, 0.5, 8000, 60); osc(c, t, 'sawtooth', 700, 60, 0.9, 0.12); osc(c, t, 'sine', 90, 25, 1.0, 0.5); },
  hurt:  (c,t) => { osc(c, t, 'square', 220, 55, 0.28, 0.16); noise(c, t, 0.2, 0.2, 2500, 300); },

  laser: (c,t) => { osc(c, t, 'sawtooth', 90, 70, 1.0, 0.08); noise(c, t, 1.0, 0.06, 1500, 600); },

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
let ctrlMode = 'follow', sens = 1.2, drag = null;
$('stage').addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  drag = {sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, id:e.pointerId};
  try{ $('stage').setPointerCapture(e.pointerId); }catch(_){}
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (ctrlMode === 'follow' && state === 'play' && G && G.ending <= 0){   // 跟手：立即移动
    const pl = G.player;
    pl.x = Math.max(12, Math.min(W-12, pl.x + (e.clientX-drag.lx)/scale*sens));
    pl.y = Math.max(12, Math.min(H-12, pl.y + (e.clientY-drag.ly)/scale*sens));
  }
  drag.lx = e.clientX; drag.ly = e.clientY;
});
addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drag = null; });
addEventListener('pointercancel', () => drag = null);
function inputVec(){
  let x = 0, y = 0;
  if (keys['a']||keys['arrowleft']) x -= 1;
  if (keys['d']||keys['arrowright']) x += 1;
  if (keys['w']||keys['arrowup']) y -= 1;
  if (keys['s']||keys['arrowdown']) y += 1;
  if (x||y){ const l = Math.hypot(x,y); return {x:x/l, y:y/l}; }
  if (drag && ctrlMode === 'stick'){
    const dx = drag.x-drag.sx, dy = drag.y-drag.sy, l = Math.hypot(dx,dy);
    if (l > 4){ const k = Math.min(1, l/50); return {x:dx/l*k, y:dy/l*k}; }
  }
  return {x:0, y:0};
}
window.inputVec = inputVec;   // 测试用：允许外部替换

let state = 'intro', P, G = null, operator = 'HO4', skill = 80, stageId = 'firewall';

function spawnBullet(x, y, ang, spd, hard, r){
  const b = BUL.take(); if (!b) return;
  b.x = x; b.y = y; b.vx = cos(ang)*spd; b.vy = sin(ang)*spd; b.r = r || (hard?7:6); b.hard = hard;
}
function burst(x, y, n, c, spd){
  if (Q.low) n = Math.ceil(n/3);
  spd = spd || 1;
  for (let i=0;i<n;i++){ const p = PART.take(); if (!p) return;
    const a = rnd()*TAU, s = (60+rnd()*220)*spd;
    p.x = x; p.y = y; p.vx = cos(a)*s; p.vy = sin(a)*s; p.life = 0.35+rnd()*0.45; p.c = c; }
}
function ring(x, y, max, life, col, w){ if (G.rings.length < 24) G.rings.push({x, y, max, life, t:0, col, w:w||2}); }
function text(s, life, size, col){ G.texts = [{s, life, max:life, size, col}]; }
function cancelBullets(){
  for (let i=0;i<BUL.n;i++){ const b = BUL.a[i], p = PART.take(); if (!p) break;
    p.x=b.x; p.y=b.y; p.vx=b.vx*0.3; p.vy=b.vy*0.3; p.life=0.5; p.c=b.hard?3:1; }
  BUL.n = 0;
}
function hitBeam(px, py, x, y, ang, len, w){   // 点到激光线段的距离
  const dx = cos(ang), dy = sin(ang); let t = (px-x)*dx + (py-y)*dy;
  if (t < 0) return false; if (t > len) t = len;
  const qx = x+dx*t-px, qy = y+dy*t-py; return qx*qx+qy*qy < w*w;
}

function hexPath(r){ ctx.beginPath(); for (let i=0;i<6;i++){ const a = i*TAU/6; i ? ctx.lineTo(cos(a)*r, sin(a)*r) : ctx.moveTo(cos(a)*r, sin(a)*r); } ctx.closePath(); }
function hpArc(e, r, col, w){ ctx.strokeStyle = col; ctx.lineWidth = w||3; ctx.beginPath(); ctx.arc(e.x, e.y, r, -Math.PI/2, -Math.PI/2 + TAU*Math.max(0,e.hp)/e.max); ctx.stroke(); }
function shieldRing(x, y, r){
  ctx.save(); ctx.setLineDash([8,6]); ctx.lineDashOffset = -G.t*40; ctx.strokeStyle = COL.fg; ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.setLineDash([2,10]); ctx.lineDashOffset = G.t*25; ctx.beginPath(); ctx.arc(x, y, r+8, 0, TAU); ctx.stroke(); ctx.restore();
}
function beam(x, y, ang, warn){
  const ex = x + cos(ang)*900, ey = y + sin(ang)*900;
  ctx.save();
  if (warn){
    ctx.setLineDash([10,8]); ctx.lineDashOffset = -G.t*60; ctx.strokeStyle = COL.danger; ctx.globalAlpha = 0.55 + 0.3*sin(G.t*30); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
  } else {
    ctx.lineCap = 'round';
    if (!Q.low){ ctx.strokeStyle = hexA(COL.danger, 0.22); ctx.lineWidth = 18 + sin(G.t*50)*3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke(); }
    ctx.strokeStyle = COL.danger; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#ffe0e0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
  }
  ctx.restore();
}
function edgeSpawn(e){
  const s = rnd()*4|0, t = rnd();
  e.x = s===0 ? t*W : s===1 ? W+30 : s===2 ? t*W : -30;
  e.y = s===0 ? -30 : s===1 ? t*H*0.6 : s===2 ? -30 : t*H*0.6;
}
function addEnemy(type, o){
  const e = Object.assign({type, x:CX, y:CY, hp:1, max:1, r:ENEMY[type].r, flash:0, t:0, cool:1, n:0, rot:0,
                           ang:0, ang2:0, aim:1.5, ax:CX, ay:CY, ph:0, st:0, bt:1, dir:1, inv:0, summon:6, lasers:[]}, o);
  e.max = e.hp;
  G.enemies.push(e); return e;
}

/* ================================================================
   五、关卡（敌人怎么组合）
   ================================================================ */
const HP = {fw:16, core:75, shooter:4, diver:5, scanner:14, boss:240};
const CORNERS = [[44,44],[556,44],[556,556],[44,556]];
const SWARM_WAVES = [
  {shooter:5, diver:1, scanners:[]},
  {shooter:5, diver:3, scanners:[0,1]},
  {shooter:7, diver:4, scanners:[2,3]},
];

const STAGE_LOGIC = {
  firewall: {
    setup(){
      for (let i=0;i<4;i++) addEnemy('firewall', {a:i*TAU/4 + Math.PI/4, hp:HP.fw, cool:1+i*0.4});
      G.core = addEnemy('core', {hp:HP.core, cool:1.2, ang:0, n:3, shield:true});
      G.total = HP.fw*4 + HP.core;
    },
    tick(){ G.fwAlive = 0; for (const e of G.enemies) if (e.type==='firewall' && e.hp>0) G.fwAlive++; },
  },
  swarm: {
    setup(){
      G.wave = -1; G.queue = []; G.waveT = 0; G.nextWaveIn = 0.4;
      G.total = SWARM_WAVES.reduce((s,w)=>s + w.shooter*HP.shooter + w.diver*HP.diver + w.scanners.length*HP.scanner, 0);
    },
    tick(dt){
      G.waveT += dt;
      if (G.queue.length && (G.spawnT -= dt) <= 0){ G.spawnT = 0.35; const q = G.queue.shift(); const e = addEnemy(q.type, q.o); if (q.type!=='scanner') edgeSpawn(e); }
      const alive = G.enemies.some(e => e.hp > 0);
      if (G.nextWaveIn > 0){ if ((G.nextWaveIn -= dt) <= 0) startWave(); return; }
      if (!G.queue.length && (!alive || G.waveT > 22) && G.wave < SWARM_WAVES.length-1) G.nextWaveIn = 0.9;
    },
    won(){ return G.wave === SWARM_WAVES.length-1 && !G.queue.length && G.nextWaveIn <= 0 && !G.enemies.some(e => e.hp > 0); },
  },
  boss: {
    setup(){ G.boss = addEnemy('boss', {hp:HP.boss, x:CX, y:-60, ph:1, cool:0.5, aim:2, summon:6}); G.total = HP.boss; },
    tick(){},
  },
};
function startWave(){
  sfx('wave');
  G.wave++; G.waveT = 0; G.spawnT = 0;
  const w = SWARM_WAVES[G.wave];
  text(`WAVE ${G.wave+1}/${SWARM_WAVES.length}`, 1.2, 40, COL.fg); ring(CX, CY, 380, 0.7, COL.fg, 3);
  for (const ci of w.scanners){ const [x,y] = CORNERS[ci];
    G.queue.push({type:'scanner', o:{hp:HP.scanner, ax:x, ay:y, x:x<CX?-30:W+30, y:y<CY?-30:H+30, bt:1+rnd(), dir:ci%2?1:-1}}); }
  for (let i=0;i<w.shooter;i++) G.queue.push({type:'shooter', o:{hp:HP.shooter, ax:70+rnd()*460, ay:50+rnd()*210, w:0.6+rnd()*0.8, cool:1+rnd()}});
  for (let i=0;i<w.diver;i++)   G.queue.push({type:'diver',   o:{hp:HP.diver,   ax:70+rnd()*460, ay:50+rnd()*200, t:-i*0.8}});
}
function bossPhase(e, ph){
  sfx('shield');
  e.ph = ph; e.inv = 1.6; e.n = 0; e.cool = 0.6;
  e.lasers = ph === 2 ? [{ang:0, spd:0.35, warn:1.4},{ang:Math.PI, spd:0.35, warn:1.4}]
           : [{ang:0, spd:-0.42, warn:1.4},{ang:TAU/3, spd:-0.42, warn:1.4},{ang:TAU*2/3, spd:-0.42, warn:1.4}];
  cancelBullets();
  text(`PHASE ${ph}`, 1.4, 52, ph===3 ? COL.danger : COL.enemy);
  ring(e.x, e.y, 480, 0.9, ph===3 ? COL.danger : COL.enemy, 6); ring(e.x, e.y, 260, 0.6, COL.fg, 3);
  burst(e.x, e.y, 60, 0, 1.6);
  G.fx.slow = 0.4; G.fx.flash = 0.4; G.fx.glitch = 0.45; G.shake = 0.8;
}

/* ---- 击破演出 ---- */
function breakSmall(e){ sfx('small'); G.lkx = e.x; G.lky = e.y; burst(e.x, e.y, 16, 1, 1); burst(e.x, e.y, 6, 0, 0.8); ring(e.x, e.y, 50, 0.35, COL.fg, 2); G.shake = Math.max(G.shake, 0.15); }
function breakBig(e, kind){
  sfx('big');
  G.lkx = e.x; G.lky = e.y;
  burst(e.x, e.y, 46, 0, 1.5); burst(e.x, e.y, 20, 1, 1.1);
  ring(e.x, e.y, 150, 0.55, COL.fg, 4); ring(e.x, e.y, 90, 0.4, COL.enemy, 2);
  G.shake = 0.45; G.fx.slow = 0.12; G.fx.flash = 0.15;
  if (kind === 'firewall'){
    const left = G.enemies.filter(x => x.type==='firewall' && x.hp>0).length;
    if (left > 0) text(`FIREWALL ${4-left}/4 BREACHED`, 1.1, 26, COL.fg);
    else {
      text('SHIELD DOWN', 1.5, 52, COL.danger); sfx('shield');
      ring(CX, CY, 480, 0.9, COL.danger, 6); ring(CX, CY, 300, 0.7, COL.fg, 3);
      cancelBullets(); G.fx.slow = 0.35; G.fx.flash = 0.45; G.fx.glitch = 0.4; G.shake = 0.7;
    }
  } else text('SCANNER DOWN', 0.9, 26, COL.fg);
}
function breakFinal(e){
  sfx('win'); bgm('');
  G.usedAt = STAGES[stageId].time - G.timeLeft;
  cancelBullets(); G.endX = e.x; G.endY = e.y;
  for (const x of G.enemies) if (x !== e && x.hp > 0){ x.hp = 0; breakSmall(x); }
  text('SYSTEM HALTED', 1.8, 46, COL.fg);
  G.fx.slow = 1.8; G.fx.glitch = 0.6; G.fx.flash = 0.3; G.shake = 0.8;
  G.player.inv = 99; G.ending = 1.8; G.endWin = true;
}

/* ================================================================
   六、主更新
   ================================================================ */
let practice = false;
function newGame(){
  P = paramsFromSkill(skill);
  stageId = stageChoice === 'random' ? STAGE_ORDER[rnd()*3|0] : stageChoice;
  BUL.n = SHOT.n = PART.n = 0;
  G = {
    t:0, timeLeft:STAGES[stageId].time,
    player:{x:CX, y:520, hp:P.playerHP, inv:0, fire:0, aim:-Math.PI/2, muzzle:0},
    enemies:[], rings:[], texts:[],
    shake:0, dealt:0, total:1, fwAlive:0,
    fx:{flash:0, red:0, slow:0, glitch:0},
    boot:1.8, ending:0, endWin:false, usedAt:0, endX:CX, endY:CY,
    practice:practice, hits:0, tips: practice ? TEXT.tips.slice() : [],
  };
  STAGE_LOGIC[stageId].setup();
  text('LINK START', 1.6, 46, COL.fg); sfx('link'); bgm(stageId==='boss'?'boss':'stage'); ring(CX, CY, 420, 0.9, COL.fg, 3); G.fx.glitch = 0.5;
  renderHP(); timerStr = '';
}

function update(rdt){
  const fx = G.fx;
  fx.flash = Math.max(0, fx.flash-rdt); fx.red = Math.max(0, fx.red-rdt); fx.slow = Math.max(0, fx.slow-rdt); fx.glitch = Math.max(0, fx.glitch-rdt);
  const dt = rdt * (fx.slow > 0 ? 0.18 : 1);
  G.t += dt;

  // 粒子（对象池，原地删除）
  const damp = Math.pow(0.04, dt);
  for (let i=PART.n-1;i>=0;i--){ const p = PART.a[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= damp; p.vy *= damp; if ((p.life -= dt) <= 0) PART.kill(i); }
  for (let i=G.rings.length-1;i>=0;i--){ const r = G.rings[i]; if ((r.t += rdt) >= r.life) G.rings.splice(i,1); }
  for (let i=G.texts.length-1;i>=0;i--){ if ((G.texts[i].life -= rdt) <= 0) G.texts.splice(i,1); }
  G.shake = Math.max(0, G.shake - rdt);
  if (G.tips.length && !G.texts.length && G.ending <= 0) text(G.tips.shift(), 2.4, 22, COL.fg);
  for (const e of G.enemies) e.flash = Math.max(0, e.flash - rdt);

  // 结束演出
  if (G.ending > 0){
    G.ending -= rdt;
    if (G.endWin && rnd() < 0.35){
      const a = rnd()*TAU, d = rnd()*70, x = G.endX+cos(a)*d, y = G.endY+sin(a)*d;
      burst(x, y, 14, rnd()<.5?0:2, 1.4); ring(x, y, 60+rnd()*80, 0.5, COL.fg, 2); G.shake = 0.4;
    }
    if (G.ending <= 0){ if (G.endWin){ fx.flash = 0.8; ring(G.endX, G.endY, 700, 1.0, COL.fg, 6); } finish(G.endWin); }
    return;
  }

  G.timeLeft -= dt; G.boot -= dt;
  const pl = G.player, bs = P.bulletSpeed, den = P.density;

  // 玩家移动（键盘 / 摇杆；跟手在 pointermove 里直接处理）
  const v = window.inputVec();
  pl.x = Math.max(12, Math.min(W-12, pl.x + v.x*240*dt));
  pl.y = Math.max(12, Math.min(H-12, pl.y + v.y*240*dt));
  pl.inv = Math.max(0, pl.inv - dt); pl.muzzle = Math.max(0, pl.muzzle - dt);

  // 关卡逻辑、敌人
  const SL = STAGE_LOGIC[stageId];
  SL.tick(dt);
  for (const e of G.enemies) if (e.hp > 0){
    ENEMY[e.type].update(e, dt, pl, bs, den);
    if (G.ending > 0) return;
    if (e.type !== 'core' && e.type !== 'boss' && pl.inv <= 0){       // 撞到小怪也会受伤
      const dx = e.x-pl.x, dy = e.y-pl.y, rr = e.r+4; if (dx*dx+dy*dy < rr*rr){ hurt(); if (G.ending > 0) return; }
    }
  }

  // 自动瞄准：最近的、可受伤的、在场内的敌人
  let tgt = null, best = 1e12;
  for (const e of G.enemies){
    if (e.hp <= 0 || e.shield || e.inv > 0 || e.x < 0 || e.x > W || e.y < 0 || e.y > H) continue;
    const dx = e.x-pl.x, dy = e.y-pl.y, d = dx*dx+dy*dy; if (d < best){ best = d; tgt = e; }
  }
  if (!tgt) tgt = G.core || G.boss;
  if (tgt) pl.aim = atan2(tgt.y-pl.y, tgt.x-pl.x);

  // 自动射击
  if ((pl.fire -= dt) <= 0){
    pl.fire = P.fireInterval; pl.muzzle = 0.05; sfx('shot');
    for (const o of [-0.06, 0.06]){ const s = SHOT.take(); if (!s) break; s.x = pl.x; s.y = pl.y; s.vx = cos(pl.aim+o)*620; s.vy = sin(pl.aim+o)*620; }
  }

  // 玩家子弹：先撞可击落子弹，再撞敌人（全部用平方距离，不开方）
  shots: for (let i=SHOT.n-1;i>=0;i--){
    const s = SHOT.a[i]; s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.x<0||s.x>W||s.y<0||s.y>H){ SHOT.kill(i); continue; }
    for (let j=BUL.n-1;j>=0;j--){ const b = BUL.a[j]; if (b.hard) continue;
      const dx = b.x-s.x, dy = b.y-s.y, rr = b.r+3;
      if (dx*dx+dy*dy < rr*rr){ burst(b.x, b.y, 5, 1, 0.8); sfx('pop'); BUL.kill(j); SHOT.kill(i); continue shots; } }
    for (const e of G.enemies){ if (e.hp <= 0) continue;
      const dx = e.x-s.x, dy = e.y-s.y, rr = (e.shield||e.inv>0) ? e.r+22 : e.r;
      if (dx*dx+dy*dy < rr*rr){
        SHOT.kill(i);
        if (e.shield || e.inv > 0){ burst(s.x, s.y, 2, 4, 0.5); continue shots; }
        e.hp--; e.flash = 0.06; G.dealt++; sfx('hit'); burst(s.x, s.y, 2, e.type==='core'||e.type==='boss'?2:0, 0.6);
        if (e.hp <= 0){ ENEMY[e.type].die(e); if (G.ending > 0) return; }
        continue shots;
      } }
  }

  // 敌方子弹
  for (let i=BUL.n-1;i>=0;i--){
    const b = BUL.a[i]; b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){ BUL.kill(i); continue; }
    if (pl.inv <= 0){ const dx = b.x-pl.x, dy = b.y-pl.y, rr = b.r+4; if (dx*dx+dy*dy < rr*rr){ hurt(); if (G.ending > 0) return; } }
  }

  // 清理已死敌人（数量很少，开销可忽略）
  if (G.enemies.some(e => e.hp <= 0 && e.type !== 'core' && e.type !== 'boss')) G.enemies = G.enemies.filter(e => e.hp > 0 || e.type==='core' || e.type==='boss');

  if (SL.won && SL.won()){ breakFinal({x:G.lkx||CX, y:G.lky||CY}); return; }
  if (G.timeLeft <= 0){
    G.timeLeft = 0; G.usedAt = STAGES[stageId].time;
    text('TIME OUT', 1.4, 48, COL.danger); sfx('lose'); bgm(''); fx.glitch = 1.0; fx.red = 0.6; G.ending = 1.2; G.endWin = false;
  }
}

function hurt(){
  if (G.ending > 0) return;
  const pl = G.player;
  pl.hp--; pl.inv = 1.3; G.shake = 0.55;
  burst(pl.x, pl.y, 30, 2, 1.3); ring(pl.x, pl.y, 110, 0.45, COL.danger, 3);
  for (let i=BUL.n-1;i>=0;i--){ const b = BUL.a[i], dx = b.x-pl.x, dy = b.y-pl.y; if (dx*dx+dy*dy < 8100) BUL.kill(i); }
  G.fx.red = 0.45; G.fx.glitch = 0.35; G.fx.slow = 0.14;
  sfx('hurt'); G.hits++;
  if (G.practice && pl.hp <= 0){ pl.hp = P.playerHP; renderHP(); text('练习：耐久已恢复', 1.0, 22, COL.ok||COL.fg); return; }
  renderHP();
  if (pl.hp <= 0){
    G.usedAt = STAGES[stageId].time - G.timeLeft;
    burst(pl.x, pl.y, 80, 0, 2); ring(pl.x, pl.y, 300, 0.8, COL.danger, 5);
    text('CONNECTION LOST', 1.6, 40, COL.danger); sfx('lose'); bgm('');
    G.fx.glitch = 1.4; G.fx.slow = 1.0; G.fx.red = 1.0; G.ending = 1.4; G.endWin = false;
  } else text('WARNING', 0.6, 30, COL.danger);
}

/* ================================================================
   七、绘制
   ================================================================ */
function draw(){
  ctx.setTransform(kk,0,0,kk,0,0);
  if (G && G.shake > 0){ const k = 16*G.shake; ctx.translate((rnd()-.5)*k, (rnd()-.5)*k); }
  ctx.fillStyle = COL.bg; ctx.fillRect(-30,-30,W+60,H+60);
  const t = G ? G.t : performance.now()/1000;

  // 网格：一条路径画完
  const off = (t*18) % 40;
  ctx.strokeStyle = COL.dim; ctx.globalAlpha = 0.16; ctx.lineWidth = 1; ctx.beginPath();
  for (let i=-40;i<=W+40;i+=40){ ctx.moveTo(i+off,0); ctx.lineTo(i+off,H); ctx.moveTo(0,i+off); ctx.lineTo(W,i+off); }
  ctx.stroke(); ctx.globalAlpha = 1;
  if (!G) return;

  // 敌人
  for (const e of G.enemies){
    if (e.hp > 0) ENEMY[e.type].draw(e);
  }

  // 敌方子弹：预渲染精灵，每颗一次 drawImage
  for (let i=0;i<BUL.n;i++){ const b = BUL.a[i]; blit(b.hard?'h':'o', b.r, b.x, b.y); }

  // 玩家子弹：两条路径画完全部
  if (!Q.low){ ctx.strokeStyle = hexA(COL.fg, 0.25); ctx.lineWidth = 6; ctx.beginPath();
    for (let i=0;i<SHOT.n;i++){ const s = SHOT.a[i]; ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*0.03, s.y-s.vy*0.03); } ctx.stroke(); }
  ctx.strokeStyle = COL.fg; ctx.lineWidth = 2; ctx.beginPath();
  for (let i=0;i<SHOT.n;i++){ const s = SHOT.a[i]; ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*0.022, s.y-s.vy*0.022); } ctx.stroke();

  // 粒子：按颜色分组，每种颜色一条路径（长度随寿命缩短，代替逐个透明度）
  ctx.lineWidth = 2;
  for (let c=0;c<PCOL.length;c++){
    ctx.strokeStyle = PCOL[c]; ctx.beginPath(); let any = false;
    for (let i=0;i<PART.n;i++){ const p = PART.a[i]; if (p.c !== c) continue; any = true;
      const k = 0.05*Math.min(1, p.life*2); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*k, p.y-p.vy*k); }
    if (any) ctx.stroke();
  }

  // 冲击波
  for (const r of G.rings){
    const k = r.t/r.life, e = 1-Math.pow(1-k,3);
    ctx.globalAlpha = 1-k; ctx.strokeStyle = r.col; ctx.lineWidth = r.w*(1-k)+0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.max*e, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 玩家
  const pl = G.player;
  if ((G.ending<=0 || G.endWin) && !(pl.inv>0 && pl.inv<90 && Math.floor(G.t*16)%2)){
    if (!Q.low) blit('p', 6, pl.x, pl.y, 0.7 + (pl.muzzle>0?0.3:0));
    ctx.save(); ctx.translate(pl.x, pl.y); ctx.rotate(pl.aim);
    ctx.fillStyle = COL.fg; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-10); ctx.lineTo(-4,0); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = COL.danger; ctx.beginPath(); ctx.arc(pl.x, pl.y, 2.5, 0, TAU); ctx.fill();
  }

  // 摇杆提示
  if (drag && state==='play' && ctrlMode==='stick'){
    const r = cv.getBoundingClientRect();
    ctx.strokeStyle = COL.dim; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc((drag.sx-r.left)/scale, (drag.sy-r.top)/scale, 50/scale, 0, TAU); ctx.stroke();
  }

  // 大字（红蓝错位）
  for (const tx of G.texts){
    const k = 1 - tx.life/tx.max, a = k<0.1 ? k/0.1 : (tx.life<0.3 ? tx.life/0.3 : 1);
    const jit = rnd()<0.25 ? (rnd()-.5)*10 : 0, y = CY - 110;
    ctx.font = `bold ${tx.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!Q.low){ ctx.globalAlpha = a*0.6; ctx.fillStyle = COL.danger; ctx.fillText(tx.s, CX+3+jit, y); ctx.fillStyle = '#5ad0ff'; ctx.fillText(tx.s, CX-3-jit, y); }
    ctx.globalAlpha = a; ctx.fillStyle = tx.col; ctx.fillText(tx.s, CX+jit, y);
  }
  ctx.globalAlpha = 1;

  if (G.timeLeft < 10 && G.ending <= 0){ ctx.strokeStyle = COL.danger; ctx.globalAlpha = 0.4+0.4*sin(t*10); ctx.lineWidth = 6; ctx.strokeRect(3,3,W-6,H-6); ctx.globalAlpha = 1; }

  // 闪光、受伤红晕（渐变只建一次）
  const fx = G.fx;
  if (fx.flash > 0){ ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.min(0.7, fx.flash*1.6); ctx.fillRect(-30,-30,W+60,H+60); ctx.globalAlpha = 1; }
  if (fx.red > 0){
    if (!VIGNETTE){ VIGNETTE = ctx.createRadialGradient(CX,CY,120,CX,CY,430); VIGNETTE.addColorStop(0, hexA(COL.danger,0)); VIGNETTE.addColorStop(1, hexA(COL.danger,0.75)); }
    ctx.globalAlpha = Math.min(1, fx.red*1.8); ctx.fillStyle = VIGNETTE; ctx.fillRect(-30,-30,W+60,H+60); ctx.globalAlpha = 1;
  }

  // 画面撕裂：把几条横带错位复制
  if (fx.glitch > 0){
    ctx.setTransform(1,0,0,1,0,0);
    const n = (Q.low ? 2 : 3) + Math.floor(fx.glitch*(Q.low?3:8)), Wp = cv.width, Hp = cv.height;
    for (let i=0;i<n;i++){ const y = rnd()*Hp, h = 4 + rnd()*Hp*0.06, dx = (rnd()-.5)*Wp*0.08*Math.min(1, fx.glitch*2);
      ctx.drawImage(cv, 0, y, Wp, h, dx, y, Wp, h); }
  }
}

/* ================================================================
   八、HUD、结果、界面
   ================================================================ */
function renderHP(){ $('hp').innerHTML = Array.from({length:P.playerHP}, (_,i) => `<span class="${i<G.player.hp?'on':''}"></span>`).join(''); }
let timerStr = '';
function renderTimer(){
  const tl = G ? G.timeLeft : STAGES[stageChoice==='random'?'firewall':stageChoice].time;
  const s = tl.toFixed(1); if (s === timerStr) return;   // 只在数字变化时写 DOM
  timerStr = s; $('timer').textContent = s; $('timer').classList.toggle('low', tl < 15);
}

let lastResult = null;
function finish(win){
  if (state !== 'play') return;
  state = 'result';
  $('btnEndPr').classList.add('hidden');
  if (G.practice){
    const used = G.usedAt || (STAGES[stageId].time - G.timeLeft);
    $('rGrade').textContent = '练习结束'; $('rGrade').className = 'grade';
    $('rText').textContent = win ? '你击破了目标。正式判定时，耐久归零就会失败。' : '练习结束。正式判定时，耐久归零或超时就会失败。';
    $('rStats').textContent = `关卡 ${STAGES[stageId].name} · 用时 ${used.toFixed(1)} 秒 · 被击中 ${G.hits} 次`;
    $('rLine').classList.add('hidden'); $('btnCopy').classList.add('hidden'); $('btnRetry').textContent = '返回';
    lastResult = null; bgm('');
    setTimeout(() => $('result').classList.remove('hidden'), 700);
    return;
  }
  $('rLine').classList.remove('hidden'); $('btnCopy').classList.remove('hidden'); $('btnRetry').textContent = '重新开始（demo）';
  const ST = STAGES[stageId], pl = G.player, used = G.usedAt || (ST.time - G.timeLeft);
  const progress = Math.min(1, G.dealt / G.total);
  const perfect = win && pl.hp === P.playerHP && (ST.time - used) >= ST.perfectLeft;
  const grade = perfect ? 'perfect' : win ? 'win' : 'lose';
  const cut = win ? 0 : Math.round(progress * CONFIG.failCutMax);
  // 回传给 KP 的结果对象（联机阶段经服务器发送）
  lastResult = {game:'hack-detention', stage:stageId, difficulty:CONFIG.difficulty, operator, skill, grade,
                hpLeft:pl.hp, hpMax:P.playerHP, time:+used.toFixed(1), progress:+progress.toFixed(2), enemyHPCut:cut};
  const gName = {perfect:TEXT.gradePerfect, win:TEXT.gradeWin, lose:TEXT.gradeLose}[grade];
  $('rGrade').textContent = gName; $('rGrade').className = 'grade ' + (win ? 'win' : 'lose');
  $('rText').innerHTML = win
    ? TEXT.winText.replace('{name}', esc(operator)) + (perfect ? '<br><span class="muted">'+TEXT.perfectExtra+'</span>' : '')
    : TEXT.loseText + '<br>' + TEXT.loseHP.replace('{pct}', Math.round(progress*100)).replace('{from}', CONFIG.enemyHP).replace('{to}', CONFIG.enemyHP - cut);
  $('rStats').textContent = `关卡 ${ST.name} · 难度 ${CONFIG.difficulty} · 用时 ${used.toFixed(1)} 秒 · 剩余耐久 ${pl.hp}/${P.playerHP} · 骇入进度 ${Math.round(progress*100)}%`;
  $('rLine').textContent = win
    ? `【骇入·拘留所】${operator} 艺术(黑客)${skill} → ${gName}（耐久 ${pl.hp}/${P.playerHP}，用时 ${used.toFixed(1)}s）`
    : `【骇入·拘留所】${operator} 艺术(黑客)${skill} → 失败（进度 ${Math.round(progress*100)}%，警察仿生人 HP ${CONFIG.enemyHP}→${CONFIG.enemyHP-cut}）`;
  setTimeout(() => $('result').classList.remove('hidden'), 700);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 难度、关卡按钮
$('diffSeg').innerHTML = CONFIG.diffTiers.map(([n,d],i) => `<button type="button" data-d="${d}" class="${i?'':'on'}">${n} ${d}</button>`).join('');
$('stageSeg').innerHTML = STAGE_ORDER.map((id,i) => `<button type="button" data-s="${id}" class="${i?'':'on'}">${STAGES[id].name}</button>`).join('') + `<button type="button" data-s="random">随机</button>`;
function segPick(seg, btn){ seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===btn)); }
$('diffSeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('diffSeg'), b); refreshIntro(); } };
$('stageSeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('stageSeg'), b); stageChoice = b.dataset.s; refreshIntro(); } };
function curDiff(){ const b = $('diffSeg').querySelector('.on'); return b ? +b.dataset.d : CONFIG.difficulty; }

function refreshIntro(){
  const s = +$('inSkill').value || 1, p = paramsFromSkill(s, curDiff());
  $('preview').textContent = `终端耐久 ${p.playerHP} · 射速 ${(1/p.fireInterval).toFixed(1)}/秒 · 敌弹速度 ×${p.bulletSpeed.toFixed(2)} · 敌弹密度 ×${p.density.toFixed(2)}`;
  const st = stageChoice === 'random' ? null : STAGES[stageChoice];
  $('rules').innerHTML = (st ? st.desc : '从三个关卡中随机抽取一个。') + '<br>' + TEXT.common.replace('{time}', st ? st.time : '70–90');
  timerStr = ''; renderTimer();
}
$('quote').textContent = TEXT.quote;
$('inSkill').addEventListener('input', refreshIntro);
$('inSens').addEventListener('input', () => $('sensV').textContent = (+$('inSens').value).toFixed(1));
$('inLow').addEventListener('change', () => { Q.forced = $('inLow').checked; setLow(Q.forced, false); });
try{ const c = JSON.parse(localStorage.getItem('void-ctrl')||'null');
  if (c){ document.querySelector(`input[name=ctrl][value=${c.ctrlMode==='stick'?'stick':'follow'}]`).checked = true;
          $('inSens').value = c.sens; $('sensV').textContent = (+c.sens).toFixed(1);
          if (c.low){ $('inLow').checked = true; Q.forced = true; }
          if (c.sfx != null){ SND.vol.sfx = c.sfx; $('inSfx').value = c.sfx; }
          if (c.bgm != null){ SND.vol.bgm = c.bgm; $('inBgm').value = c.bgm; }
          if (c.mute){ SND.mute = true; $('btnMute').textContent = '声音 关'; } } }catch(_){}

function begin(isPractice){
  sndInit(); sfx('click'); practice = isPractice;
  operator = $('inName').value.trim() || 'HO4';
  skill = Math.max(1, Math.min(99, +$('inSkill').value || 1)); $('inSkill').value = skill;
  CONFIG.difficulty = curDiff();
  ctrlMode = document.querySelector('input[name=ctrl]:checked').value;
  sens = +$('inSens').value;
  saveSettings();
  newGame(); $('intro').classList.add('hidden'); state = 'play'; perf.t = 0; perf.ema = 1/60;
  $('btnEndPr').classList.toggle('hidden', !practice); resize();
}
$('btnStart').onclick = () => begin(false);
$('btnPractice').onclick = () => begin(true);
$('btnEndPr').onclick = () => { if (state === 'play' && G && G.practice){ G.usedAt = STAGES[stageId].time - G.timeLeft; finish(false); } };
$('tools').addEventListener('pointerdown', e => e.stopPropagation());
$('btnMute').onclick = () => { SND.mute = !SND.mute; $('btnMute').textContent = SND.mute ? '声音 关' : '声音 开'; sndApplyVol(); saveSettings(); };
$('inSfx').oninput = () => { SND.vol.sfx = +$('inSfx').value; sndApplyVol(); };
$('inBgm').oninput = () => { SND.vol.bgm = +$('inBgm').value; sndApplyVol(); };
$('inSfx').onchange = () => { sndInit(); sfx('hit'); saveSettings(); };
$('inBgm').onchange = saveSettings;
function saveSettings(){ try{ localStorage.setItem('void-ctrl', JSON.stringify({ctrlMode, sens, low:Q.forced, sfx:SND.vol.sfx, bgm:SND.vol.bgm, mute:SND.mute})); }catch(_){} }
$('btnRetry').onclick = () => { sfx('click'); $('btnEndPr').classList.add('hidden'); $('result').classList.add('hidden'); $('intro').classList.remove('hidden'); state = 'intro'; G = null; refreshIntro(); };
$('btnCopy').onclick = () => {
  const txt = $('rLine').textContent;
  const done = () => { $('btnCopy').textContent = '已复制'; setTimeout(() => $('btnCopy').textContent = '复制结果', 1500); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
};

/* ================================================================
   九、主循环 + 自动画质：连续 1.5 秒平均帧耗时超过 26ms 就切到简化特效
   ================================================================ */
const perf = {ema:1/60, t:0};
let last = performance.now();
function loop(now){
  const raw = (now - last)/1000, dt = Math.min(0.05, raw); last = now;
  if (state === 'play'){
    update(dt); renderTimer();
    perf.ema = perf.ema*0.95 + raw*0.05;
    if (!Q.low && perf.ema > 0.026){ if ((perf.t += raw) > 1.5) setLow(true, true); } else perf.t = 0;
  }
  draw();
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
readTheme(); setLow(Q.forced, false); resize(); refreshIntro();
requestAnimationFrame(loop);

// 测试接口
window.__void = {get G(){return G;}, get state(){return state;}, set state(v){state=v;}, get lastResult(){return lastResult;},
  BUL, SND, newGame, update, hurt, setSkill:v=>skill=v, setStage:v=>stageChoice=v, setDiff:v=>CONFIG.difficulty=v, draw};
}
</script>
</body>
