<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID // 录像排序 demo</title>
<style>
/* ===== 外观（之后由编辑器“外观”页修改） ===== */
:root{
  --bg:#0b0b0d;          /* 背景 */
  --fg:#e8e4d8;          /* 主色：文字、线框 */
  --dim:#6d6a62;         /* 次要文字 */
  --accent:#d9822b;      /* 强调色、教学高亮 */
  --danger:#d33a3a;      /* 错误、失败、空缺 */
  --ok:#9fd3a8;          /* 成功 */
  --void:#29a6ff;        /* VOID 燃料 */
  --font:"Courier New","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;max-width:820px;display:flex;white-space:nowrap;gap:8px;justify-content:space-between;align-items:center;
  padding:8px 12px;font-size:13px;letter-spacing:1px;border-bottom:1px solid var(--dim)}
#hud .label{color:var(--dim)}
#err span{display:inline-block;width:10px;height:10px;margin-left:3px;border:1px solid var(--danger)}
#err span.on{background:var(--danger)}
#main{position:relative;flex:1;width:100%;max-width:820px;overflow-y:auto;overflow-x:hidden;padding:10px 12px 150px;touch-action:pan-y}
#boot{font-size:12px;line-height:1.6;color:var(--ok);white-space:pre-wrap;margin-bottom:6px}
#boot .w{color:var(--danger)}
#msg{min-height:20px;font-size:12px;color:var(--dim);margin-bottom:8px;line-height:1.6}
#msg.ok{color:var(--ok)} #msg.ng{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--dim);padding:4px;cursor:pointer;position:relative;background:#111114;transition:transform .35s,opacity .35s}
.card canvas{display:block;width:100%;aspect-ratio:4/3}
.card .cap{display:flex;justify-content:space-between;font-size:11px;padding:3px 2px 0;letter-spacing:0}
.card .cap b{font-weight:normal;color:var(--dim)}
.card.gone{opacity:.22;pointer-events:none;transform:scale(.92)}
.card.gone::after{content:'已剔除';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;letter-spacing:4px;color:var(--danger)}
.card.hint{border:1px dashed var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.placed{opacity:.3;pointer-events:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 时间轴 */
#tlWrap{overflow:hidden;padding:2px 0}
#tl{position:relative;height:34px;border:1px solid var(--dim);margin:6px 0 2px;transform-origin:50% 50%}
#tl.zoom{animation:tlzoom 1.6s ease-in-out}
@keyframes tlzoom{0%{transform:scale(1)}35%,65%{transform:scale(2.6)}100%{transform:scale(1)}}
#tl .blk{position:absolute;top:3px;bottom:3px;background:var(--fg);opacity:.75;animation:fill .35s ease-out}
@keyframes fill{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#tl .hole{position:absolute;top:0;bottom:0;border:1px solid var(--danger);background:rgba(211,58,58,.25);
  animation:blink 1s steps(2) infinite;cursor:pointer}
@keyframes blink{50%{background:rgba(211,58,58,.05)}}
#tlAxis{position:relative;height:14px;font-size:10px;color:var(--dim)}
#tlAxis span{position:absolute;transform:translateX(-50%)}
#tlAxis span:first-child{transform:none}
#dm{font-size:18px;letter-spacing:3px;color:var(--danger);margin:6px 0 2px;font-weight:bold;animation:glitchT 1.2s infinite}
@keyframes glitchT{0%,88%,100%{text-shadow:none;transform:none}90%{text-shadow:-3px 0 #29a6ff,3px 0 #d33a3a;transform:translateX(2px)}94%{text-shadow:3px 0 #29a6ff,-3px 0 #d33a3a;transform:translateX(-2px)}}
/* 弹层 */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(11,11,13,.95);z-index:5;padding:12px}
.panel{width:100%;max-width:460px;border:1px solid var(--fg);padding:18px 18px 16px;font-size:13px;line-height:1.7;
  max-height:100%;overflow:auto;touch-action:pan-y;background:var(--bg)}
.panel.wide{max-width:680px;padding:10px}
.panel h1{font-size:15px;letter-spacing:3px;margin-bottom:10px;border-bottom:1px solid var(--dim);padding-bottom:6px}
.panel hr{border:0;border-top:1px dashed var(--dim);margin:10px 0}
.muted{color:var(--dim);font-size:11px}
.notes div{margin:2px 0;padding-left:1em;text-indent:-1em}
#vWrap{position:relative;margin:0 auto;width:max-content}
#vc{display:block;border:1px solid var(--dim);background:#000;cursor:zoom-in}
#stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg);border:3px solid;padding:6px 14px;
  font-size:20px;font-weight:bold;letter-spacing:3px;text-align:center;line-height:1.3;pointer-events:none;background:rgba(0,0,0,.55);white-space:nowrap}
#stamp small{display:block;font-size:12px;letter-spacing:6px}
#stamp.splice{color:var(--danger);border-color:var(--danger)}
#stamp.intact{color:var(--ok);border-color:var(--ok)}
#stamp.on{animation:stampIn .22s ease-out}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}}
#vInfo{font-size:12px;margin-top:6px;min-height:18px}
#vCap{font-size:13px;margin-top:6px;line-height:1.7;min-height:44px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
input{background:transparent;color:var(--fg);border:1px solid var(--dim);font:inherit;padding:2px 6px;width:64px}
input.name{width:90px}
input[type=checkbox]{accent-color:var(--fg);width:auto}
label{cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--fg)}
.seg button{margin:0;background:transparent;color:var(--fg);padding:5px 9px;letter-spacing:1px;font-weight:normal}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:bold}
button{background:var(--fg);color:var(--bg);border:0;font:inherit;font-weight:bold;letter-spacing:2px;
  padding:9px 16px;margin-top:10px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
button.danger{background:var(--danger);color:var(--bg)}
button:disabled{opacity:.35;cursor:default}
.mini{margin:0;padding:2px 8px;font-size:11px;letter-spacing:0;background:transparent;color:var(--fg);border:1px solid var(--dim);font-weight:normal}
.grade{font-size:28px;letter-spacing:6px;margin:4px 0 8px;display:inline-block}
.grade.win{color:var(--ok)} .grade.lose{color:var(--danger)}
.grade.on{animation:stampIn2 .3s ease-out}
@keyframes stampIn2{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.resline{border:1px solid var(--dim);padding:6px 8px;margin-top:8px;font-size:12px;word-break:break-all;-webkit-user-select:text;user-select:text}
/* 教学锁定 */
#spot{position:fixed;z-index:40;pointer-events:none;border:2px dashed var(--accent);box-shadow:0 0 0 200vmax rgba(0,0,0,.62);
  animation:spot 1s steps(2) infinite;transition:left .2s,top .2s,width .2s,height .2s}
@keyframes spot{50%{border-color:transparent}}
#btnSkipTut{position:fixed;z-index:50;top:44px;right:8px;margin:0;background:var(--bg)}
/* 一羽 */
#ichi{position:fixed;z-index:50;right:max(6px, calc(50vw - 404px));bottom:8px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
#ichiC{width:96px;height:96px;cursor:pointer;pointer-events:auto}
#bubble{pointer-events:auto;max-width:280px;background:var(--fg);color:var(--bg);font-size:13px;line-height:1.6;padding:8px 12px;
  margin-bottom:4px;position:relative;cursor:pointer;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#bubble.on{opacity:1;transform:none}
#bubble::after{content:'';position:absolute;right:38px;bottom:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--fg)}
#bubble b{display:block;font-size:10px;color:#6d6a62;letter-spacing:2px}
/* 教学对话框 */
#dlg{position:fixed;z-index:55;left:50%;transform:translateX(-50%);bottom:12px;width:min(620px, calc(100vw - 16px));
  display:flex;gap:12px;align-items:flex-start;background:rgba(11,11,13,.97);border:1px solid var(--fg);padding:10px 14px 10px 10px;cursor:pointer}
#dlg.top{bottom:auto;top:84px}
#dlg.shake{animation:shakeX .3s}
@keyframes shakeX{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
#dlgC{width:88px;height:88px;flex:none}
#dlg .who{font-size:11px;color:var(--accent);letter-spacing:3px}
#dlgT{font-size:14px;line-height:1.75;min-height:50px}
#dlgNext{font-size:11px;color:var(--dim);text-align:right;animation:spot 1s steps(2) infinite}
@media (max-width:480px){ #dlgC{width:64px;height:64px} #dlgT{font-size:13px} #ichiC{width:80px;height:80px} }
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span class="label">STEP</span> <span id="step">—</span></div>
    <div><button type="button" class="mini" id="btnNotes">情报</button> <button type="button" class="mini hidden" id="btnHint">提示</button></div>
    <div><span class="label">错误</span><span id="err"></span></div>
  </div>
  <div id="main">
    <div id="boot"></div>
    <div id="msg"></div>
    <div id="sortBox" class="hidden">
      <div id="tlWrap"><div id="tl"></div></div>
      <div id="tlAxis"></div>
      <div id="dm" class="hidden"></div>
      <div class="row"><button type="button" id="btnRecover" class="danger hidden">恢复空缺</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="intro">
  <div class="panel">
    <h1>VOID // FOOTAGE</h1>
    <div>佐久间彰人公寓 · 门口监控</div>
    <div class="muted">2050-09-02 06:00–19:00</div>
    <hr>
    <div class="row">操作者 <input class="name" id="inName" value="HO2"></div>
    <div class="row">《计算机使用》 <input id="inSkill" type="number" min="1" max="99" value="80"></div>
    <div class="row">段数 <span class="seg" id="tierSeg">
      <button type="button" data-t="auto" class="on">按技能</button><button type="button" data-t="high">6 段</button><button type="button" data-t="low">8 段</button></span></div>
    <div class="muted" id="preview"></div>
    <div class="row">允许重来 <span class="seg" id="retrySeg">
      <button type="button" data-r="0">0</button><button type="button" data-r="1" class="on">1</button><button type="button" data-r="2">2</button><button type="button" data-r="3">3</button></span> 次</div>
    <div class="row">教学 <span class="seg" id="tutSeg"><button type="button" data-v="1" class="on">开</button><button type="button" data-v="0">关</button></span></div>
    <div class="row">破绽类型 <span id="clueBox"></span></div>
    <div class="row"><label><input type="checkbox" id="inLow"> 简化特效</label><span class="muted">（卡顿时会自动开启）</span></div>
    <hr>
    <div id="rules"></div>
    <div class="muted" id="voidInfo" style="margin-bottom:6px"></div>
    <div class="row"><button id="btnStart">调取录像</button></div>
    <div class="muted" id="demoNote" style="margin-top:8px">demo：正式版中技能值由角色录入界面提供；段数、重来次数、教学、破绽类型由 KP 设定，玩家看不到。</div>
  </div>
</div>

<!-- 情报 -->
<div class="overlay hidden" id="notes">
  <div class="panel">
    <h1>已知信息</h1>
    <div class="notes" id="notesList"></div>
    <div class="row"><button type="button" id="btnNotesClose">关闭</button></div>
  </div>
</div>

<!-- 查看片段 / 恢复播放 -->
<div class="overlay hidden" id="viewer">
  <div class="panel wide">
    <div id="vWrap"><canvas id="vc"></canvas><div id="stamp" class="hidden"></div></div>
    <div id="vInfo"></div>
    <div id="vCap" class="hidden"></div>
    <div class="row" id="vBtns">
      <button type="button" class="ghost" id="btnPrev">‹</button>
      <button type="button" class="ghost" id="btnNext">›</button>
      <button type="button" class="danger" id="btnMark">标为伪造</button>
      <button type="button" class="ghost" id="btnClose">返回</button>
    </div>
    <div class="row hidden" id="pBtns"><button type="button" id="btnPlayNext">继续</button></div>
  </div>
</div>

<!-- 结果 -->
<div class="overlay hidden" id="result">
  <div class="panel">
    <h1>VOID // RESULT</h1>
    <div class="grade" id="rGrade"></div>
    <div id="rText"></div>
    <hr>
    <div id="rStats" class="muted"></div>
    <div class="resline" id="rLine"></div>
    <div class="muted" id="voidUp" style="display:none"></div>
    <div class="row">
      <button id="btnRetry" class="hidden">重来</button>
      <button id="btnCopy">复制结果</button>
      <button class="ghost" id="btnAgain">重新开始（demo）</button>
    </div>
  </div>
</div>

<div id="spot" class="hidden"></div>
<button type="button" class="mini hidden" id="btnSkipTut">跳过教学 ›</button>
<div id="ichi" class="hidden"><div id="bubble"><b>一羽</b><span id="bubbleT"></span></div><canvas id="ichiC" width="256" height="256"></canvas></div>
<div id="dlg" class="hidden"><canvas id="dlgC" width="256" height="256"></canvas>
  <div style="flex:1"><div class="who">一羽</div><div id="dlgT"></div><div id="dlgNext">▼ 点击继续</div></div></div>

<script>
{
/* ================================================================
   一、可编辑内容（之后由编辑器的“文本”“数值”“素材”页修改）
   ================================================================ */
const TEXT = {
  rules: '录像被拆成若干片段，其中混入了<b>其他日期</b>的录像。<br>' +

         '② 把剩下的片段按时间顺序排好。<br>' +
         '③ 恢复被删除的部分。<br>' +
         '点画面可以放大。右上方“情报”可以随时查看已知信息。',
  notes: [
    '气象记录：9 月 2 日全天降雨。',
    '房东：“早报每天早上送到门口，他上午就会拿进屋。”',
    '房东：“他很少出门。出门回来会把伞撑开晾在门口，晾一晚上才收。”',
    '房东：“有只白色的野猫傍晚会来门口的垫子上躲雨，白天从来不来。”',
  ],
  tutNotes: ['今天是 10 月 16 日。', '青木：“这、这段监控？就是普通的工作日常啦……”'],
  boot: ['> CONNECT CAM-02 ........ OK', '> LOAD 2050-09-02 06:00–19:00', '> SEGMENTS: {n}', '> CHECKSUM ........ 拼接痕迹 ×{f}'],
  tutBoot: ['> CONNECT CAM-B3 ........ OK', '> LOAD 2050-10-16 13:00–16:00', '> SEGMENTS: 3', '> CHECKSUM ........ 拼接痕迹 ×1'],
  reveal: {
    weather:  '地面是干的，还有影子——这是晴天拍的。',
    umbrella: '他那天没出过门，门口不该晾着伞——这是别的日子的录像。',
    paper:    '门口堆着好几天的报纸——这是佐久间出事以后的录像。',
    cat:      '野猫只在傍晚来——这是别的日子的录像。',
    calendar: '日历是 9 号，录像却是 16 号——青木拿别的日子补上了。',
  },
  hint: {
    weather:  '提示：这一段的天气不对劲。',
    umbrella: '提示：注意这一段门口多了什么。',

    cat:      '提示：注意这一段门口的垫子。',
  },
  stampSplice: ['SPLICE DETECTED', '拼接痕迹'],
  stampIntact: ['INTEGRITY OK', '数据完整'],
  wrong: '数据完整，没有拼接痕迹。',
  foundAll: '已剔除全部伪造片段。按时间顺序点选剩下的片段。',
  sortWrong: '时间不连续，不是这一段。',
  sorted: '{from}–{to} 之间没有任何录像。点击空缺执行恢复。',
  zoomTip: '点击画面放大 / 缩小',
  rec: [
    '{t} 一个戴黑色兜帽的人走到门前，蹲下，摆弄门边的读卡器。几秒后，门开了。看不清脸。',
    '{t} 约十分钟后，那个人从屋里出来，压低兜帽，快步走出画面。',
  ],
  recPerfect: '画面放大后能看到：那个人走过的地上留下了几滴亮蓝色的液体。（VOID 的燃料）',
  analysis: 'ANALYSIS: 液体 → VOID 燃料',
  tutRec: '{t} 青木从抽屉里摸出一罐汽水，左右看了看，一口气喝掉半罐。',
  gradePerfect: '极限成功', gradeWin: '成功', gradeLose: '失败',
  winText: '你们恢复了 9/2 下午被删除的录像。',
  perfectExtra: '（极限成功：恢复画面中发现了蓝色液体）',
  loseText: '录像确实被修改过，好像是把其他日期的录像拼接上去了。但没能找出被替换的部分。',
};

// 一羽台词库。weather/umbrella/paper/cat 只在本局用到该破绽时出现。
const ICHI = {
  open: ['这个小程序是青木写的哦～一羽是助手！……青木说不加的话？嘿嘿，那一羽就去告诉蕾米了呢。'],
  general: [
    '也许会有什么多出来的东西哦～',
    '一直盯着同一扇门，一羽的眼睛都要长茧了呢。',
    '房东大叔的话不看吗？好不容易问来的哦。',
    '明明看一眼就能发现的事，盯太久反而会漏掉呢～人类真是不可思议。',
    '那天的天气还记得吗？不记得的话一羽可要笑你了哦。',
  ],
  weather: [
    '9 月 2 号不是一整天都在下雨吗？那这个影子是哪来的呢～',
    '哇，这一段的地面好干净哦。干净得有点可疑呢。',
    '下雨天还有这么好的太阳？一羽也想要这种天气。',
  ],
  umbrella: [
    '哎呀好古板的伞，嗯？那把伞？',
    '一整天都窝在家里的人，门口怎么会晾着伞呢？',
    '地上的水还没干哦～是谁刚从外面回来呢？',
  ],
  paper: [
    '报纸堆成小山了呢。一份都不收，是有多懒呀～',
    '一天一份的话……这里少说也有好几天了吧？',
    '那天早上的报纸，不是已经被拿进去了吗？',
  ],
  cat: [
    '小猫会在雨天出门？真罕见啊。',
    '白色的小猫咪，好可爱～不过现在是几点来着？',
    '房东大叔说它只在傍晚才来哦。这只猫是不是看错时间了？',
  ],
  right: ['答对啦～这一段是别的日子的哦。', '嘿嘿，被一羽……啊不对，被你找到了呢。', '拼得还挺用心的嘛，可惜遇到我们了哦。'],
  wrong: ['啊……这段是真的哦。好可惜呢～', '欸——那段明明很正常嘛。', '没关系没关系，一羽不会告诉赤星的哦。'],
  lastChance: ['再错一次就真的不行了哦？一羽可不想陪你从头看一遍。', '要不要先去翻翻情报呢？一羽是在给你台阶下哦。'],
  sort: ['按时间排好就行了哦，这个总不会错了吧？', '嗯？中间好像少了一截呢。'],
  gap: ['下午三点前后，整整空了一大段哦。', '删得这么干净，反而更可疑了呢～'],
  recover: ['来了来了——', '……这个人，是谁呢？'],
  tut: {
    start: '先来练练手吧～这是仿生科的监控哦，青木的座位。',
    open:  '先点开一段看看吧～',

let AC = null, NOISE = null;
function sndInit(){
  if (AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(_){ return; }
  NOISE = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
  const d = NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = rnd()*2-1;
}
function tone(f, dur, type, vol, f2, delay){
  if (!AC) return;
  const t = AC.currentTime + (delay||0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, freq, delay){
  if (!AC) return;
  const t = AC.currentTime + (delay||0), s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = freq || 1800;
  g.gain.setValueAtTime(vol||0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+dur);
}

const NOISE_C = (() => { const c = mk(PW, PH), g = c.getContext('2d'), d = g.createImageData(PW, PH);
  for (let i=0;i<d.data.length;i+=4){ const v = rnd()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=rnd()*90; }

}
function rainStreaks(g, seed, t){
  g.save(); g.strokeStyle = 'rgba(225,230,240,.45)'; g.lineWidth = 1.5; g.beginPath();
  for (let i=0;i<46;i++){
    const h = Math.sin(seed*13.1 + i*91.7)*43758.5, fx = h - Math.floor(h);
    const h2 = Math.sin(seed*7.3 + i*12.9)*12543.1, fy = h2 - Math.floor(h2);
    const x = 456 + fx*184, y = 72 + ((fy*230 + t*520) % 230);
    g.moveTo(x, y); g.lineTo(x-4, y+16);
  }
  g.stroke(); g.restore();
}
function drawCalendar(g, n){

  g.fillStyle = '#c03030'; g.font = `bold ${Math.round(b.h*0.15)}px "Courier New",monospace`; g.fillText('OCT', b.x + b.w/2, b.y + b.h*0.16);
  g.fillStyle = '#1e1e1e'; g.font = `bold ${Math.round(b.h*0.58)}px "Courier New",monospace`; g.fillText(String(n), b.x + b.w/2, b.y + b.h*0.6);
  g.restore();

// seg: {scene:'apt'|'office', weather, light, items[], time(分钟), sec, cal}
function compose(seg){
  const c = mk(IW, IH), g = c.getContext('2d'), office = seg.scene === 'office';
  drawImg(g, A(office ? 'bg_office' : seg.weather === 'sun' ? 'bg_sunny' : 'bg_rain'));
  if (office) drawCalendar(g, seg.cal);
  for (const it of seg.items) if (!AFTER_FILTER.includes(it)) drawImg(g, A(it));
  if (!office && seg.weather !== 'sun') rainStreaks(g, seg.time, 0);
  if (seg.light === 'morning'){ g.fillStyle = 'rgba(170,190,255,.12)'; g.fillRect(0,0,IW,IH); }
  if (seg.light === 'dusk'){ g.fillStyle = 'rgba(20,10,40,.38)'; g.fillRect(0,0,IW,IH); g.fillStyle = 'rgba(255,120,40,.14)'; g.fillRect(0,0,IW,IH); }
  // 监控滤镜：降低饱和度 + 偏绿
  g.globalCompositeOperation = 'saturation'; g.fillStyle = 'rgba(128,128,128,.7)'; g.fillRect(0,0,IW,IH);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(70,140,95,.10)'; g.fillRect(0,0,IW,IH);
  for (const it of seg.items) if (AFTER_FILTER.includes(it)) drawImg(g, A(it));
  g.fillStyle = 'rgba(0,0,0,.16)'; for (let y=0;y<IH;y+=3) g.fillRect(0,y,IW,1);
  const vgr = g.createRadialGradient(IW/2, IH/2, IH*0.35, IW/2, IH/2, IH*0.85);
  vgr.addColorStop(0, 'rgba(0,0,0,0)'); vgr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vgr; g.fillRect(0,0,IW,IH);
  g.font = 'bold 20px "Courier New",monospace'; g.textBaseline = 'top'; g.shadowColor = '#000'; g.shadowBlur = 3;
  g.fillStyle = '#e8e4d8'; g.fillText(office ? 'CAM-B3' : 'CAM-02', 14, 12);
  g.fillStyle = '#e04040'; g.fillText('● REC', 100, 12);
  g.fillStyle = '#e8e4d8'; g.fillText((office ? CONFIG.tutDate : CONFIG.date) + ' ' + hm(seg.time) + ':' + String(seg.sec||0).padStart(2,'0'), 14, IH-34);
  g.shadowBlur = 0;
  return c;
}

  if (img._r) return img;
  const mkT = col => { const c = mk(IW, IH), g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0,0,IW,IH); return c; };
  img._r = mkT('#ff0000'); img._c = mkT('#00ffff'); return img;
}
const TMP = mk(16, 12), TG = TMP.getContext('2d');
function mosaic(g, img, block, W, H, sx, sy, sw, sh){
  sx = sx||0; sy = sy||0; sw = sw||IW; sh = sh||IH;
  const tw = Math.max(1, Math.ceil(W/block)), th = Math.max(1, Math.ceil(H/block));
  if (TMP.width < tw || TMP.height < th){ TMP.width = Math.max(TMP.width, tw); TMP.height = Math.max(TMP.height, th); }
  TG.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);
  g.imageSmoothingEnabled = false; g.drawImage(TMP, 0, 0, tw, th, 0, 0, W, H); g.imageSmoothingEnabled = true;
}

// 真实的 9/2：全天下雨；没有伞（没出门）、没有报纸（上午已拿进屋）；傍晚白猫来门口地垫。
const FAKE_LOOK = {
  weather:  {weather:'sun',  items:[]},
  umbrella: {weather:'rain', items:['umbrella']},
  paper:    {weather:'rain', items:['newspaper']},
  cat:      {weather:'rain', items:['cat']},
};
function realLook(start){
  if (start < 10*60+25) return {weather:'rain', light:'morning', items:[]};
  if (start >= 17*60)   return {weather:'rain', light:'dusk',    items:['cat']};
  return {weather:'rain', light:'day', items:[]};
}
function finishSegs(segs){
  segs.forEach((s,i) => { s.no = i+1; s.gone = false; s.placed = false; s.img = compose(s); });
  return segs;
}
function buildRound(tier, types){
  const T = CONFIG.tiers[tier];
  const hs = 14*60 + ri(50, 58), he = 15*60 + ri(28, 40);          // 被删除的区间
  const b1 = 10*60 + ri(20, 30), b2 = 13*60 + ri(0, 15), b3 = 17*60 + ri(10, 25);
  const cuts = tier === 'high' ? [[CONFIG.dayStart,b1],[b1,b2],[b2,hs],[he,b3],[b3,CONFIG.dayEnd]]
                               : (m => [[CONFIG.dayStart,b1],[b1,m],[m,b2],[b2,hs],[he,b3],[b3,CONFIG.dayEnd]])(11*60+ri(45,58));
  const segs = cuts.map(([s,e]) => Object.assign({scene:'apt', start:s, end:e, time:s, sec:ri(0,59), fake:false, clue:null}, realLook(s)));
  const pool = shuffle(types.slice()), picks = [];
  for (let i=0;i<T.fakes;i++) picks.push(pool.length ? pool[i % pool.length] : 'weather');
  const fr = T.fakes === 1 ? [[hs,he]] : (m => [[hs,m],[m,he]])(hs + Math.round((he-hs)/2) + ri(-4,4));
  fr.forEach(([s,e], i) => { const L = FAKE_LOOK[picks[i]];
    segs.push({scene:'apt', start:s, end:e, time:s, sec:ri(0,59), fake:true, clue:picks[i], weather:L.weather, light:'day', items:L.items.slice()}); });
  return {tut:false, tier, segs:finishSegs(shuffle(segs)), hole:[hs,he], fakes:T.fakes, hints:T.hint, clues:[...new Set(picks)]};
}
function buildTutorial(){
  const mkS = (s, e, fake) => ({scene:'office', start:s, end:e, time:s, sec:ri(0,59), fake, clue:fake ? 'calendar' : null,
                                weather:'rain', light:'day', items:[], cal: fake ? 9 : 16});
  const segs = [mkS(14*60+48, 16*60, false), mkS(14*60+21, 14*60+48, true), mkS(13*60, 14*60+21, false)];
  return {tut:true, tier:'tut', segs:finishSegs(segs), hole:[14*60+21, 14*60+48], fakes:1, hints:0, clues:['calendar']};
}

const ichiC = $('ichiC'), ichiG = ichiC.getContext('2d');
let ichiFace = '', ichiTimer = 0, ichiIdx = {}, ichiLast = '';
function ichiDraw(face){
  if (face === ichiFace) return; ichiFace = face;
  ichiG.clearRect(0,0,256,256); ichiG.drawImage(A('ichiha_'+face), 0, 0, 256, 256);
}
// 一羽说话：事件台词排队，每句至少显示 ichiMin（长句按字数延长）；force = 立刻说（点一羽、标错反馈）
let ichiQ = [], ichiQT = 0, ichiMinUntil = 0;
function say(text, face, dur, force){
  if (!text) return;
  const now = performance.now();
  if (force){ ichiQ = []; clearTimeout(ichiQT); }
  else if ($('bubble').classList.contains('on') && now < ichiMinUntil){
    ichiQ.push([text, face, dur]); if (ichiQ.length > 2) ichiQ.shift();
    clearTimeout(ichiQT); ichiQT = setTimeout(ichiFlush, ichiMinUntil - now); return;
  }
  ichiLast = text; $('bubbleT').textContent = text; $('bubble').classList.add('on');
  ichiDraw(face || 'normal');
  const minMs = Math.max(CONFIG.ichiMin, text.length * CONFIG.ichiPerChar);
  ichiMinUntil = now + minMs;
  clearTimeout(ichiTimer);
  ichiTimer = setTimeout(() => { $('bubble').classList.remove('on'); ichiDraw('normal'); }, Math.max(dur || CONFIG.ichiSay, minMs + 1500));
  if (ichiQ.length){ clearTimeout(ichiQT); ichiQT = setTimeout(ichiFlush, minMs); }
}
function ichiFlush(){ const n = ichiQ.shift(); if (n){ ichiMinUntil = 0; say(n[0], n[1], n[2]); } }
function ichiReset(){ ichiQ = []; clearTimeout(ichiQT); clearTimeout(ichiTimer); ichiMinUntil = 0; $('bubble').classList.remove('on'); }
function sayFrom(key, face){ const L = ICHI[key]; if (!L || !L.length) return;
  ichiIdx[key] = ((ichiIdx[key] ?? -1) + 1) % L.length; say(L[ichiIdx[key]], face); }
function ichiPool(){
  if (state === 'find'){
    let L = ICHI.general.slice();
    for (const c of R.clues) if (ICHI[c]) L = L.concat(ICHI[c]);
    if (errors === CONFIG.maxErrors - 1) L = L.concat(ICHI.lastChance);
    return L;
  }
  if (state === 'sort') return ICHI.sort;
  if (state === 'gap') return ICHI.gap;
  if (state === 'recover') return ICHI.recover;
  return ICHI.open;
}
function ichiTap(){
  const L = ichiPool(); if (!L.length) return;
  let t = L[Math.floor(rnd()*L.length)];
  if (L.length > 1) while (t === ichiLast) t = L[Math.floor(rnd()*L.length)];
  SFX.tick(); say(t, 'normal', 0, true);
}
ichiC.addEventListener('click', ichiTap);
$('bubble').addEventListener('click', ichiTap);

function renderErr(){ $('err').innerHTML = Array.from({length:CONFIG.maxErrors}, (_,i) => `<span class="${i<errors?'on':''}"></span>`).join(''); }

/* ---------- 网格 + 解码动画 ---------- */
let decodes = [];   // {cv, img, t0}
function renderGrid(list, animate){
  $('grid').innerHTML = list.map(s => `<div class="card" data-no="${s.no}"><canvas width="320" height="240"></canvas>` +
    `<div class="cap"><span>${hm(s.start)}–${hm(s.end)}</span><b>#${String(s.no).padStart(2,'0')}</b></div></div>`).join('');
  const now = performance.now();
  $('grid').querySelectorAll('.card').forEach((el, i) => {
    const s = R.segs.find(x => x.no == el.dataset.no), cv = el.querySelector('canvas'), g = cv.getContext('2d');
    el.classList.toggle('gone', s.gone);
    if (animate){ g.fillStyle = '#000'; g.fillRect(0,0,320,240); decodes.push({g, img:s.img, t0: now + i*(Q.low ? 40 : 110), gen}); }
    else g.drawImage(s.img, 0, 0, 320, 240);
  });
}
function stepDecodes(now){
  if (!decodes.length) return;
  const D = Q.low ? 200 : 520;
  decodes = decodes.filter(d => {
    if (d.gen !== gen) return false;
    const p = (now - d.t0) / D; if (p < 0) return true;
    if (p >= 1){ d.g.drawImage(d.img, 0, 0, 320, 240); return false; }
    const block = Q.low ? 40 : [48, 24, 12, 6, 3][Math.floor(p*5)];
    mosaic(d.g, d.img, block, 320, 240);
    if (!Q.low){ d.g.fillStyle = 'rgba(159,211,168,.5)'; d.g.fillRect(0, p*240, 320, 2); }
    if (!d.ticked && p > 0){ d.ticked = true; SFX.tick(); }
    return true;
  });
}

/* ---------- 开局：终端文字 → 片段逐张解码 ---------- */

/* ---------- 查看器绘制（只在打开时运行） ---------- */
let noiseT = 0, noiseX = 0, noiseY = 0, hexRows = [], hexT = 0;
const HEX = '0123456789ABCDEF';
function frameRect(){
  const zs = view ? view.zs : 1, sw = IW/zs, sh = IH/zs;
  const sx = clamp((view ? view.zx : IW/2) - sw/2, 0, IW - sw), sy = clamp((view ? view.zy : IH/2) - sh/2, 0, IH - sh);
  return {sx, sy, sw, sh};
}
function drawNoise(W, H, now, a){
  if (now - noiseT > 80){ noiseT = now; noiseX = rnd()*-40; noiseY = rnd()*-30; }
  vg.globalAlpha = a; vg.drawImage(NOISE_C, noiseX, noiseY, W+40, H+30); vg.globalAlpha = 1;
}
function drawBase(img, seg, now, rgb){
  const W = vc.width, H = vc.height, r = frameRect(), k = W / r.sw;
  vg.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H);
  if (rgb > 0.5 && !Q.low){
    tinted(img); vg.globalCompositeOperation = 'lighter'; vg.globalAlpha = 0.5;
    vg.drawImage(img._r, r.sx, r.sy, r.sw, r.sh, -rgb*k, 0, W, H);
    vg.drawImage(img._c, r.sx, r.sy, r.sw, r.sh,  rgb*k, 0, W, H);
    vg.globalCompositeOperation = 'source-over'; vg.globalAlpha = 1;
  }
  if (seg && seg.scene !== 'office' && seg.weather !== 'sun'){
    vg.setTransform(k, 0, 0, k, -r.sx*k, -r.sy*k); rainStreaks(vg, seg.time + 7, (now - view.t0)/1000); vg.setTransform(1,0,0,1,0,0);
  }
  drawNoise(W, H, now, 0.2);
}
function drawHex(W, H, now, p){
  vg.fillStyle = '#000'; vg.fillRect(0,0,W,H);
  const fs = Math.round(13 * W / 640) + 2, rows = Math.floor(H*0.8 / (fs*1.25)), cols = Math.floor(W / (fs*0.62)) - 2;
  if (!Q.low && now - hexT > 50){
    hexT = now; let s = ''; for (let i=0;i<cols;i++) s += (i%3===2) ? ' ' : HEX[Math.floor(rnd()*16)];
    hexRows.push(s); while (hexRows.length > rows) hexRows.shift();
  }
  vg.font = `${fs}px "Courier New",monospace`; vg.textBaseline = 'top';
  hexRows.forEach((l, i) => { vg.fillStyle = i === hexRows.length-1 ? '#9fd3a8' : 'rgba(159,211,168,.45)'; vg.fillText(l, fs*0.6, fs*0.6 + i*fs*1.25); });
  const bw = W*0.7, bx = (W-bw)/2, by = H*0.86, bh = Math.max(6, H*0.025);
  vg.strokeStyle = '#e8e4d8'; vg.lineWidth = 1; vg.strokeRect(bx, by, bw, bh);
  vg.fillStyle = '#d33a3a'; vg.fillRect(bx+2, by+2, (bw-4)*p, bh-4);
  vg.fillStyle = '#e8e4d8'; vg.textBaseline = 'bottom'; vg.fillText(`RECONSTRUCTING ${Math.floor(p*100)}%`, bx, by - 4);
  drawNoise(W, H, now, 0.12);
}
function drawViewer(now){
  if (!view) return;
  const W = vc.width, H = vc.height;
  view.zs += (view.zt - view.zs) * 0.18; if (Math.abs(view.zt - view.zs) < 0.002) view.zs = view.zt;
  vc.style.cursor = view.zs > 1.01 ? 'zoom-out' : 'zoom-in';
  vg.setTransform(1,0,0,1,0,0);

  if (view.mode === 'play'){
    const e = now - view.pt0;
    if (view.phase === 'hex'){
      drawHex(W, H, now, Math.min(1, e / view.hexDur));
      if (e >= view.hexDur){ hexRows = []; nextFrame(); }
      return;
    }
    if (view.phase === 'build'){
      const D = Q.low ? 500 : 1300, p = Math.min(1, e / D);
      if (p < 1){
        const blocks = [64, 40, 24, 14, 8, 4, 2], block = blocks[Math.min(blocks.length-1, Math.floor(p*blocks.length))] * W/640;
        mosaic(vg, view.img, Math.max(1, block), W, H);
        if (!Q.low){
          const off = 14*(1-p); tinted(view.img); vg.globalCompositeOperation = 'lighter'; vg.globalAlpha = 0.35*(1-p);
          vg.drawImage(view.img._r, -off*W/640, 0, W, H); vg.drawImage(view.img._c, off*W/640, 0, W, H);
          vg.globalCompositeOperation = 'source-over'; vg.globalAlpha = 1;
          vg.fillStyle = 'rgba(159,211,168,.6)'; vg.fillRect(0, p*H, W, 2);
        }
        drawNoise(W, H, now, 0.3*(1-p) + 0.1);
        return;
      }
      view.phase = 'show'; onBuilt();
    }
    drawBase(view.img, view.seg, now, 0);
    if (view.phase === 'analyze'){
      const b = CONFIG.dropsBox, r = frameRect(), k = W / r.sw, ae = Math.min(1, (now - view.pt0)/500);
      const x = (b.x - r.sx)*k, y = (b.y - r.sy)*k, w = b.w*k, h = b.h*k, L = Math.min(w, h)*0.25*ae;
      vg.strokeStyle = '#29a6ff'; vg.lineWidth = Math.max(2, W/320);
      vg.beginPath();
      for (const [cx, cy, dx, dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){ vg.moveTo(cx+dx*L, cy); vg.lineTo(cx, cy); vg.lineTo(cx, cy+dy*L); }
      vg.stroke();
      if (now - view.pt0 > 900){
        vg.font = `bold ${Math.round(W/40)}px "Courier New",monospace`; vg.textBaseline = 'top';
        vg.fillStyle = 'rgba(0,0,0,.6)'; const tw = vg.measureText(TEXT.analysis).width;
        vg.fillRect(W*0.04 - 4, H*0.12 - 4, tw + 8, W/40 + 10);
        vg.fillStyle = '#29a6ff'; vg.fillText(TEXT.analysis, W*0.04, H*0.12);
      }
    }
    return;
  }

  // 查看片段 + 标记特效
  const fx = view.fx, fe = fx ? now - fx.t0 : 0;
  if (fx && fx.type === 'intact' && fe < 450){
    vg.save(); vg.translate((rnd()-0.5)*W*0.03, (rnd()-0.5)*H*0.02); drawBase(view.img, view.seg, now, 0); vg.restore();
    vg.fillStyle = `rgba(211,58,58,${0.35*(1-fe/450)})`; vg.fillRect(0,0,W,H);
    return;
  }
  if (fx && fx.type === 'splice'){
    const scanP = Math.min(1, fe / 420);
    drawBase(view.img, view.seg, now, Q.low ? 0 : 10*Math.min(1, fe/300));
    if (!Q.low && fe > 150){   // 撕裂
      for (let i=0;i<7;i++){ const y = rnd()*H, h = 4 + rnd()*H*0.07, dx = (rnd()-0.5)*W*0.2; vg.drawImage(vc, 0, y, W, h, dx, y, W, h); }
    }
    if (scanP < 1){
      const y = scanP*H, gr = vg.createLinearGradient(0, y-H*0.15, 0, y);
      gr.addColorStop(0, 'rgba(211,58,58,0)'); gr.addColorStop(1, 'rgba(211,58,58,.45)');
      vg.fillStyle = gr; vg.fillRect(0, y-H*0.15, W, H*0.15); vg.fillStyle = '#ff4a4a'; vg.fillRect(0, y-2, W, 3);
    }
    if (fe > 520){   // 碎成像素块
      const n = fx.order.length, cols = Q.low ? 8 : 16, rows = n / cols, bw = W/cols, bh = H/rows;
      const cnt = Math.floor(Math.min(1, (fe - 520) / 560) * n);
      vg.fillStyle = '#000';
      for (let i=0;i<cnt;i++){ const id = fx.order[i]; vg.fillRect((id % cols)*bw, Math.floor(id / cols)*bh, bw+1, bh+1); }
    }
    return;
  }
  drawBase(view.img, view.seg, now, 0);
}

/* ================================================================
   八、教学（锁定式指引）
   ================================================================ */
const tut = {on:false, step:0};
/* 教学对话：逐字打出，点一下打完，再点一下下一句；一组说完才开放这一步的操作 */
const dlg = {queue:[], text:'', i:0, typing:false, waiting:false, done:null, timer:0, restore:0};
const dlgG = $('dlgC').getContext('2d');
function dlgFace(face){ dlgG.clearRect(0,0,256,256); dlgG.drawImage(A('ichiha_'+(face||'normal')), 0, 0, 256, 256); }
function dlgType(text, face){
  clearTimeout(dlg.timer); dlg.text = text; dlg.i = 0; dlg.typing = true; dlgFace(face);
  $('dlgNext').classList.add('hidden');
  const step = () => {
    dlg.i++; $('dlgT').textContent = dlg.text.slice(0, dlg.i); if (dlg.i % 3 === 0) SFX.tick();
    if (dlg.i < dlg.text.length) dlg.timer = setTimeout(step, CONFIG.typeMs);
    else { dlg.typing = false; if (dlg.waiting) $('dlgNext').classList.remove('hidden'); }
  };
  step();
}
function tutSay(lines, done){
  tut.step = 0; spotKey = ''; clearTimeout(dlg.restore);
  dlg.queue = lines.slice(); dlg.done = done; dlgNextLine();
}
function dlgNextLine(){
  const l = dlg.queue.shift();
  if (!l){ dlg.waiting = false; $('dlgNext').classList.add('hidden'); const d = dlg.done; dlg.done = null; if (d) d(); return; }
  dlg.waiting = true; dlgType(l[0], l[1]);
}
$('dlg').addEventListener('click', () => {
  if (dlg.typing){ clearTimeout(dlg.timer); dlg.i = dlg.text.length; $('dlgT').textContent = dlg.text; dlg.typing = false;
                   if (dlg.waiting) $('dlgNext').classList.remove('hidden'); return; }
  if (dlg.waiting){ SFX.click(); dlgNextLine(); }
});
function dlgWrong(){
  const box = $('dlg'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  if (dlg.waiting) return;          // 对话还没看完：只抖一下
  const keep = dlg.text; dlgType(pick(ICHI.tutWrongClick), 'puzzled'); SFX.ng();
  clearTimeout(dlg.restore); dlg.restore = setTimeout(() => { if (tut.on && !dlg.waiting) dlgType(keep, 'normal'); }, 1800);
}
const spot = $('spot');
function tutTarget(){
  switch (tut.step){
    case 1: return cardEl(R.segs.find(s => s.fake).no);
    case 2: { const r = vc.getBoundingClientRect(), fr = frameRect(), b = CONFIG.calBox, k = r.width / fr.sw;
              return {rect:{left:r.left + (b.x-fr.sx)*k, top:r.top + (b.y-fr.sy)*k, width:b.w*k, height:b.h*k}, el:vc}; }
    case 3: return $('btnMark');
    case 4: return cardEl(sortList[sortNext] && sortList[sortNext].no);
    case 5: return $('tl').querySelector('.hole');
    case 6: return $('btnPlayNext');
  }
  return null;
}
function tutRect(){
  if (dlg.waiting) return $('dlg').getBoundingClientRect();
  const t = tutTarget(); if (!t) return null;
  return t.rect || (t.getBoundingClientRect ? t.getBoundingClientRect() : null);
}
let spotKey = '';
function updateSpot(){
  const talking = tut.on && dlg.waiting;
  if (!tut.on || (tut.step < 1 && !talking)){ if (spotKey !== 'off'){ spot.classList.add('hidden'); spotKey = 'off'; } return; }
  const r = tutRect(); if (!r || !r.width){ spot.classList.add('hidden'); spotKey = 'off'; return; }
  if (!talking){   // 目标在屏幕下方时，对话框移到上方，避免挡住
    const box = $('dlg'), bh = box.offsetHeight;
    box.classList.toggle('top', r.top + r.height > innerHeight - bh - 28);
  }
  const p = 4, key = [r.left, r.top, r.width, r.height].map(Math.round).join(',');
  if (key === spotKey) return; spotKey = key;
  spot.classList.remove('hidden');
  Object.assign(spot.style, {left:(r.left-p)+'px', top:(r.top-p)+'px', width:(r.width+p*2)+'px', height:(r.height+p*2)+'px'});
}
function tutStep(n){
  tut.step = n; spotKey = '';
  if (n === 4 && sortList[sortNext]){ const el = cardEl(sortList[sortNext].no); el && el.scrollIntoView({block:'nearest'}); }
}
// 锁定：教学中只有高亮的目标、“跳过教学”和一羽能点
addEventListener('click', e => {
  if (!tut.on) return;
  if (e.target.closest('#btnSkipTut,#dlg')) return;
  let ok = false;
  if (tut.step >= 1 && !dlg.waiting){
    const t = tutTarget(), el = t && (t.el || t);
    ok = !!(el && el.contains && el.contains(e.target));
    if (ok && t.rect){ const r = t.rect; ok = e.clientX >= r.left && e.clientX <= r.left + r.width && e.clientY >= r.top && e.clientY <= r.top + r.height; }
  }
  if (ok) return;
  e.stopPropagation(); e.preventDefault();
  if (tut.step !== -1) dlgWrong();
}, true);

function startTutorial(){
  tut.on = true; tut.step = -1;
  $('btnSkipTut').classList.remove('hidden'); $('notesList').innerHTML = TEXT.tutNotes.map(n => `<div>· ${esc(n)}</div>`).join('');
  $('ichi').classList.add('hidden'); $('dlg').classList.remove('hidden'); $('dlg').classList.remove('top');
  $('dlgT').textContent = ''; dlgFace('normal'); $('dlgNext').classList.add('hidden');
  bootRound(buildTutorial(), () => {
    state = 'find'; setStep('教学 ① 找出伪造片段'); setMsg('检测到拼接痕迹 <b>1</b> 处。');
    tutSay([[ICHI.open[0], 'happy'], [ICHI.tut.start], [ICHI.tut.open]], () => tutStep(1));
  });
}
function tutEnd(){
  tut.on = false; tut.step = 0; spot.classList.add('hidden'); spotKey = 'off';
  clearTimeout(dlg.timer); clearTimeout(dlg.restore); dlg.queue = []; dlg.waiting = dlg.typing = false; dlg.done = null;
  $('dlg').classList.add('hidden');
  $('btnSkipTut').classList.add('hidden'); closeViewer(); decodes = [];
  if (CONFIG._ds != null){ CONFIG.dayStart = CONFIG._ds; CONFIG.dayEnd = CONFIG._de; CONFIG._ds = null; }
  $('notesList').innerHTML = TEXT.notes.map(n => `<div>· ${esc(n)}</div>`).join('');
  $('tl').classList.remove('zoom');
}
function tutFinish(){
  state = 'intro'; tutSay([[ICHI.tut.end, 'happy']], () => { tutEnd(); startRound(); });
}
$('btnSkipTut').onclick = () => { SFX.click(); gen++; tutEnd(); state = 'intro'; startRound(); };

/* ---------- 结果 ---------- */
function finish(win){
  if (state === 'result') return;
  state = 'result';
  const used = (performance.now() - tStart)/1000;
  const perfect = win && errors === 0 && attempt === 1 && !hintUsed;
  const grade = perfect ? 'perfect' : win ? 'win' : 'lose';
  const canRetry = !win && attempt <= retries;
  const gName = {perfect:TEXT.gradePerfect, win:TEXT.gradeWin, lose:TEXT.gradeLose}[grade];
  lastResult = {game:'footage-sort', operator, skill, segments:R.segs.length, fakes:R.fakes, clues:R.clues, grade,
                errors, attempt, hintUsed, time:+used.toFixed(1), final:!canRetry};
  if (VB) VB.report(Object.assign({}, lastResult, {official: VB.official}));
  $('rGrade').textContent = gName; $('rGrade').className = 'grade ' + (win ? 'win' : 'lose');
  $('rText').innerHTML = win ? TEXT.winText + (perfect ? '<br><span class="muted">' + TEXT.perfectExtra + '</span>' : '') : TEXT.loseText;
  $('rStats').textContent = `${R.segs.length} 段（伪造 ${R.fakes}）· 错误 ${errors}/${CONFIG.maxErrors} · 第 ${attempt} 次尝试` +
    (hintUsed ? ' · 用了提示' : '') + ` · 用时 ${used.toFixed(1)} 秒`;
  $('rLine').textContent = `【录像排序·第二现场】${operator} 计算机使用${skill} → ${gName}（${R.segs.length}段，错误${errors}次，第${attempt}次尝试${hintUsed?'，用了提示':''}）`;
  $('btnRetry').classList.toggle('hidden', !canRetry);
  $('btnRetry').textContent = `重来（剩余 ${retries - attempt + 1} 次）`;
  $('btnCopy').textContent = canRetry ? '放弃，复制失败结果' : '复制结果';
  win ? SFX.win() : SFX.lose();
  setTimeout(() => { $('result').classList.remove('hidden'); const g = $('rGrade'); g.classList.remove('on'); void g.offsetWidth; g.classList.add('on'); SFX.stamp(); }, 600);
  setTimeout(() => say(win ? (perfect ? '完美～这个蓝色的东西，一羽好像在哪里见过呢。' : '找回来了哦～') : '……没关系，录像被改过这件事，至少确定了呢。', win ? 'happy' : 'puzzled'), 900);
}
$('btnRetry').onclick = () => { SFX.click(); attempt++; $('result').classList.add('hidden'); startRound(); };
$('btnAgain').onclick = () => { SFX.click(); ichiReset(); $('ichi').classList.add('hidden'); $('result').classList.add('hidden'); $('intro').classList.remove('hidden'); state = 'intro'; refreshIntro(); };
$('btnCopy').onclick = () => {
  const txt = $('rLine').textContent, b = $('btnCopy'), old = b.textContent;
  const done = () => { b.textContent = '已复制'; setTimeout(() => b.textContent = old, 1500); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
};

/* ---------- 开始界面 ---------- */
$('clueBox').innerHTML = Object.entries(CONFIG.clueTypes).map(([k,n]) => `<label><input type="checkbox" value="${k}" checked> ${n}</label>`).join(' ');
function segPick(seg, btn){ seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===btn)); }
$('tierSeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('tierSeg'), b); tierChoice = b.dataset.t; refreshIntro(); } };
$('retrySeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('retrySeg'), b); retries = +b.dataset.r; } };
$('tutSeg').onclick = e => { const b = e.target.closest('button'); if (b){ segPick($('tutSeg'), b); tutOn = b.dataset.v === '1'; } };
$('inLow').addEventListener('change', () => { Q.forced = $('inLow').checked; Q.low = Q.forced; });
function refreshIntro(){
  skill = Math.max(1, Math.min(99, +$('inSkill').value || 1));
  const t = curTier(), T = CONFIG.tiers[t];
  $('preview').textContent = t === 'high' ? `6 段，其中伪造 ${T.fakes} 段，可用提示 ${T.hint} 次` : `8 段，其中伪造 ${T.fakes} 段，无提示`;
  $('rules').innerHTML = TEXT.rules.replace('{maxErr}', CONFIG.maxErrors) +
    '<br><span class="muted">零失误、未用提示、第一次就通关为极限成功；重来后通关为成功。</span>';
}
$('inSkill').addEventListener('input', refreshIntro);
// 从平台打开时，点开始先向服务器登记这一局（还有正式判定就用掉一次），再开始
$('btnStart').onclick = async () => {
  sndInit();
  if (VB){
    $('btnStart').disabled = true;
    const r = await VB.start();
    $('btnStart').disabled = false;
    if (!r.ok){ $('voidInfo').textContent = r.error; return; }
  }
  introStart();
};
function introStart(){
  sndInit(); SFX.click();
  operator = $('inName').value.trim() || 'HO2'; refreshIntro(); $('inSkill').value = skill;
  attempt = 1; openSaid = false; $('intro').classList.add('hidden');
  if (tutOn){ openSaid = true; startTutorial(); } else startRound();
};
$('notesList').innerHTML = TEXT.notes.map(n => `<div>· ${esc(n)}</div>`).join('');
$('btnNotes').onclick = () => { SFX.click(); $('notes').classList.remove('hidden'); };
$('btnNotesClose').onclick = () => { SFX.click(); $('notes').classList.add('hidden'); };

/* ---------- 主循环 + 自动画质：特效期间平均帧耗时超过 30ms 持续 1 秒就切到简化特效 ---------- */
let last = performance.now();
function loop(now){
  const raw = (now - last)/1000; last = now;
  const busy = view || decodes.length;
  drawViewer(now); stepDecodes(now); updateSpot();
  if (busy && !Q.low){
    Q.ema = Q.ema*0.95 + raw*0.05;
    if (Q.ema > 0.030){ if ((Q.t += raw) > 1) Q.low = true; } else Q.t = 0;
  }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { if (view) fitViewer(); spotKey = ''; });
initPlaceholders(); ichiDraw('normal'); renderErr(); refreshIntro();
$('btnStart').disabled = true; $('btnStart').textContent = '加载中…';
loadAssets().then(() => { ichiFace = ''; ichiDraw('normal'); dlgFace('normal'); $('btnStart').disabled = false; $('btnStart').textContent = '调取录像'; if (voidLabel) voidLabel(); });
requestAnimationFrame(loop);

/* ---------- 平台对接：从平台打开时，技能值和 KP 的设置由平台给，结果自动上传给 KP ---------- */
var VB = window.VOIDB && window.VOIDB.active ? window.VOIDB : null, voidLabel = null;
if (VB){
  const S = VB.session, st = S.settings || {};
  $('inName').value = S.ho + ' ' + S.name; $('inName').readOnly = true;
  $('inSkill').value = Math.max(1, Math.min(99, S.skill || 1)); $('inSkill').readOnly = true;
  // KP 的设置（段数、重来次数、教学、破绽类型）对玩家隐藏
  tierChoice = st.tier || 'auto';
  retries = Number(st.retries ?? 1);
  tutOn = String(st.tut ?? '1') === '1';
  const clues = Array.isArray(st.clues) && st.clues.length ? st.clues : Object.keys(CONFIG.clueTypes);
  for (const c of document.querySelectorAll('#clueBox input')) c.checked = clues.includes(c.value);
  for (const id of ['tierSeg', 'retrySeg', 'tutSeg', 'clueBox']) $(id).closest('.row').style.display = 'none';
  $('preview').style.display = 'none'; $('demoNote').style.display = 'none';
  // 结果自动传给 KP，不让玩家复制到群里（里面有技能名和数值）
  $('btnCopy').style.display = 'none'; $('rLine').style.display = 'none';
  $('btnAgain').textContent = '返回开始界面';
  VB.statusInto($('voidUp'));
  const label = () => {
    $('btnStart').textContent = S.official ? '调取录像（正式判定）' : '调取录像（练习，不计结果）';
    $('voidInfo').textContent = S.official ? `正式判定还剩 ${S.allowed - S.used} 次，点“调取录像”就算用掉一次。` : '正式判定已经用完。现在开始的结果只作为练习记录。';
  };
  voidLabel = label; label(); VB.onStatus(label); refreshIntro();
}

// 测试接口
window.__void = {get R(){return R;}, get state(){return state;}, get lastResult(){return lastResult;}, get tut(){return tut;},
  get sortList(){return sortList;}, get dlg(){return dlg;}, Q, compose, A, finish};
}
